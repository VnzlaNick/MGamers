<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Acceso al foro</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #e8f1ff 0, transparent 45%),
        #f5f7fb;
    }

    .card {
      width: min(100%, 460px);
      padding: 32px;
      background: #fff;
      border: 1px solid #e3e8f0;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgb(31 45 75 / 9%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #4263eb;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2rem);
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 8px 0 24px;
      color: #647087;
      line-height: 1.5;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 20px;
      padding: 4px;
      background: #f0f3f8;
      border-radius: 12px;
    }

    .mode-tab {
      padding: 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #647087;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .mode-tab[aria-selected="true"] {
      background: #fff;
      color: #172033;
      box-shadow: 0 1px 4px rgb(31 45 75 / 12%);
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label,
    .field-title {
      color: #263249;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .required {
      color: #d33b55;
    }

    .field-hint {
      color: #778197;
      font-size: 0.78rem;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder {
      color: #9aa3b3;
    }

    input:focus {
      border-color: #5277f5;
      box-shadow: 0 0 0 3px rgb(82 119 245 / 14%);
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    .password-row input {
      flex: 1;
      min-width: 0;
    }

    .small-button {
      padding: 0 12px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      background: #fff;
      color: #46536c;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .strength-label {
      min-height: 1.2em;
      color: #778197;
      font-size: 0.78rem;
    }

    .strength-bars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .strength-bars span {
      height: 4px;
      border-radius: 99px;
      background: #e5e9f0;
    }

    .strength-bars .weak {
      background: #e5484d;
    }

    .strength-bars .medium {
      background: #e5a524;
    }

    .strength-bars .good {
      background: #3985e8;
    }

    .strength-bars .strong {
      background: #22a06b;
    }

    .games {
      display: grid;
      gap: 9px;
    }

    .games-heading {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }

    .optional {
      color: #778197;
      font-size: 0.78rem;
      font-weight: 450;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .game-chip {
      min-height: 42px;
      padding: 9px 10px;
      border: 1px solid #e0e5ee;
      border-radius: 10px;
      background: #fff;
      color: #354158;
      text-align: left;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .game-chip:hover {
      background: #f7f9ff;
    }

    .game-chip[aria-pressed="true"] {
      border-color: #5277f5;
      background: #eef2ff;
      color: #3154ce;
    }

    .primary-button,
    .google-button {
      width: 100%;
      min-height: 47px;
      border-radius: 11px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      border: 0;
      background: #4263eb;
      color: #fff;
      box-shadow: 0 5px 12px rgb(66 99 235 / 20%);
    }

    .primary-button:hover {
      background: #3454d1;
    }

    .primary-button:disabled,
    .google-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #8992a3;
      font-size: 0.77rem;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      background: #e7eaf0;
      content: "";
    }

    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #d8deea;
      background: #fff;
      color: #263249;
    }

    .google-button:hover {
      background: #f8faff;
    }

    .google-mark {
      color: #4285f4;
      font-size: 1.05rem;
      font-weight: 800;
    }

    #auth-message {
      min-height: 1.3em;
      margin: 0;
      color: #526078;
      font-size: 0.88rem;
      line-height: 1.45;
      text-align: center;
    }

    #auth-message[data-kind="error"] {
      color: #c7354d;
    }

    #auth-message[data-kind="success"] {
      color: #168253;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="eyebrow">Comunidad Móvil Gamers </p>
    <h1 id="page-title">Bienvenido Guerrero</h1>
    <p class="intro" id="page-intro">Inicia sesión o crea una cuenta para entrar al foro.</p>

    <div class="mode-tabs" role="tablist" aria-label="Acceso">
      <button
        class="mode-tab"
        id="login-tab"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="auth-form"
      >
        Iniciar sesión
      </button>
      <button
        class="mode-tab"
        id="register-tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="auth-form"
      >
        Crear cuenta
      </button>
    </div>

    <form id="auth-form">
      <div class="field" id="username-field" hidden>
        <label for="username">
          Nombre de usuario <span class="required">*</span>
        </label>
        <input
          id="username"
          name="username"
          type="text"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          placeholder="Ej.: VnzlaPro_99"
        >
        <span class="field-hint">Será tu alias público en el foro.</span>
      </div>

      <div class="field">
        <label for="email">
          Correo electrónico <span class="required">*</span>
        </label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          placeholder="tu-correo@ejemplo.com"
        >
      </div>

      <div class="field">
        <label for="password">
          Contraseña <span class="required">*</span>
        </label>
        <div class="password-row">
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            required
            autocomplete="current-password"
            placeholder="Mínimo 8 caracteres"
          >
          <button
            class="small-button"
            type="button"
            data-toggle-password="password"
            aria-label="Mostrar contraseña"
          >Mostrar</button>
        </div>

        <div id="password-strength" hidden>
          <div class="strength-label" id="strength-label">Mínimo 8 caracteres</div>
          <div class="strength-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="field" id="confirm-field" hidden>
        <label for="confirm-password">
          Confirmar contraseña <span class="required">*</span>
        </label>
        <div class="password-row">
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Escribe de nuevo tu contraseña"
          >
          <button
            class="small-button"
            type="button"
            data-toggle-password="confirm-password"
            aria-label="Mostrar confirmación de contraseña"
          >Mostrar</button>
        </div>
      </div>

      <div class="games" id="games-field" hidden>
        <div class="games-heading">
          <span class="field-title">Juego móvil principal</span>
          <span class="optional">Opcional</span>
        </div>
        <div class="games-grid" aria-label="Selecciona tu juego principal">
          <button class="game-chip" type="button" data-game="Free Fire" aria-pressed="false">
            Free Fire
          </button>
          <button class="game-chip" type="button" data-game="Blood Strike" aria-pressed="false">
            Blood Strike
          </button>
          <button class="game-chip" type="button" data-game="Mobile Legends" aria-pressed="false">
            Mobile Legends
          </button>
          <button class="game-chip" type="button" data-game="Servidores Mu" aria-pressed="false">
            Servidores Mu
          </button>
        </div>
      </div>

      <button class="primary-button" id="submit-button" type="submit">
        Iniciar sesión
      </button>

      <p class="divider" id="divider-label">o continúa con</p>

      <button class="google-button" id="google-button" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        Continuar con Google
      </button>

      <p id="auth-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const AUTH_REDIRECT_URL = "https://vnzlanick.github.io/MGamers/";

    const supabase = createClient(
      "https://zrrpjbqduwtaxsfbsuum.supabase.co",
      "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp"
    );

    const form = document.getElementById("auth-form");
    const message = document.getElementById("auth-message");
    const submitButton = document.getElementById("submit-button");
    const googleButton = document.getElementById("google-button");
    const loginTab = document.getElementById("login-tab");
    const registerTab = document.getElementById("register-tab");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm-password");

    let mode = "login";
    let selectedGame = "";

    function showMessage(text, kind = "") {
      message.textContent = text;
      message.dataset.kind = kind;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isRegister = mode === "register";

      document.getElementById("page-title").textContent =
        isRegister ? "Únete al foro" : "Bienvenido";
      document.getElementById("page-intro").textContent =
        isRegister
          ? "Crea tu cuenta para participar en la comunidad."
          : "Inicia sesión para entrar al foro.";

      loginTab.setAttribute("aria-selected", String(!isRegister));
      registerTab.setAttribute("aria-selected", String(isRegister));

      document.getElementById("username-field").hidden = !isRegister;
      document.getElementById("confirm-field").hidden = !isRegister;
      document.getElementById("games-field").hidden = !isRegister;
      document.getElementById("password-strength").hidden = !isRegister;

      usernameInput.required = isRegister;
      confirmInput.required = isRegister;
      passwordInput.autocomplete = isRegister ? "new-password" : "current-password";

      submitButton.textContent = isRegister ? "Crear cuenta" : "Iniciar sesión";
      document.getElementById("divider-label").textContent =
        isRegister ? "o regístrate con" : "o continúa con";

      showMessage("");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    document.querySelectorAll("[data-toggle-password]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.togglePassword);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Ocultar" : "Mostrar";
        button.setAttribute(
          "aria-label",
          show ? "Ocultar contraseña" : "Mostrar contraseña"
        );
      });
    });

    document.querySelectorAll(".game-chip").forEach((button) => {
      button.addEventListener("click", () => {
        const wasSelected = button.getAttribute("aria-pressed") === "true";

        document.querySelectorAll(".game-chip").forEach((chip) => {
          chip.setAttribute("aria-pressed", "false");
        });

        selectedGame = wasSelected ? "" : button.dataset.game;
        if (!wasSelected) {
          button.setAttribute("aria-pressed", "true");
        }
      });
    });

    passwordInput.addEventListener("input", () => {
      const password = passwordInput.value;
      const bars = document.querySelectorAll(".strength-bars span");
      const checks = [
        password.length >= 8,
        /[a-z]/.test(password) && /[A-Z]/.test(password),
        /\d/.test(password),
        /[^A-Za-z0-9]/.test(password)
      ];
      const score = checks.filter(Boolean).length;
      const strengthClasses = ["weak", "medium", "good", "strong"];

      document.getElementById("strength-label").textContent =
        password.length < 8
          ? "Mínimo 8 caracteres"
          : score < 2
            ? "Contraseña débil"
            : score < 4
              ? "Contraseña aceptable"
              : "Contraseña fuerte";

      bars.forEach((bar, index) => {
        bar.className = "";
        if (index < score) {
          bar.classList.add(strengthClasses[score - 1]);
        }
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("");

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (mode === "register") {
        if (password !== confirmInput.value) {
          showMessage("Las contraseñas no coinciden.", "error");
          confirmInput.focus();
          return;
        }

        if (usernameInput.value.trim().length < 3) {
          showMessage("El nombre de usuario debe tener al menos 3 caracteres.", "error");
          usernameInput.focus();
          return;
        }
      }

      submitButton.disabled = true;
      submitButton.textContent =
        mode === "register" ? "Creando cuenta…" : "Iniciando sesión…";

      try {
        if (mode === "register") {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: AUTH_REDIRECT_URL,
              data: {
                username: usernameInput.value.trim(),
                favorite_game: selectedGame || null
              }
            }
          });

          if (error) throw error;

          showMessage(
            data.session
              ? "Cuenta creada. Ya iniciaste sesión."
              : "Registro enviado. Revisa tu correo para confirmar la cuenta.",
            "success"
          );

          passwordInput.value = "";
          confirmInput.value = "";
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showMessage("Inicio de sesión correcto. Ya puedes continuar al foro.", "success");
          passwordInput.value = "";
        }
      } catch (error) {
        showMessage(error?.message || "No se pudo completar la operación.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent =
          mode === "register" ? "Crear cuenta" : "Iniciar sesión";
      }
    });

    googleButton.addEventListener("click", async () => {
      googleButton.disabled = true;
      showMessage("");

      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: AUTH_REDIRECT_URL }
        });

        if (error) throw error;
      } catch (error) {
        showMessage(error?.message || "No se pudo iniciar sesión con Google.", "error");
        googleButton.disabled = false;
      }
    });

    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const oauthError =
      hashParams.get("error_description") ||
      hashParams.get("error");

    if (oauthError) {
      showMessage(oauthError, "error");
    } else {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        showMessage(`Sesión activa: ${data.session.user.email}`, "success");
      }
    }
  </script>
</body>
</html>
