<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | Foro</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #20283a;
      --muted: #6d778b;
      --line: #e4e9f1;
      --blue: #4169e1;
      --blue-light: #edf2ff;
      --gold-light: #fff5dc;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    .page {
      width: min(920px, 100%);
      margin: auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 30px #24345a0d;
    }

    .cover {
      position: relative;
      height: 170px;
      overflow: hidden;
      background: linear-gradient(120deg, #dce8ff, #e8f8fb);
    }

    .cover-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgb(0 0 0 / 20%), transparent 55%);
      pointer-events: none;
    }

    .cover-edit-button {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 2;
      padding: 7px 11px;
      border: 1px solid rgb(255 255 255 / 70%);
      border-radius: 999px;
      background: rgb(255 255 255 / 88%);
      color: #38445a;
      font: inherit;
      font-size: .82rem;
      font-weight: 600;
      box-shadow: 0 2px 8px #0002;
      opacity: .88;
      cursor: pointer;
      transition: opacity .15s, background .15s;
    }

    .cover-edit-button:hover {
      background: white;
      opacity: 1;
    }

    .cover-edit-button:disabled,
    .avatar-edit-button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 26px 24px;
    }

    .avatar-wrap {
      position: relative;
      display: grid;
      width: 100px;
      height: 100px;
      margin-top: -38px;
      flex: 0 0 100px;
      place-items: center;
      overflow: hidden;
      border: 5px solid white;
      border-radius: 50%;
      background: #dfe8ff;
      color: var(--blue);
      font-size: 2rem;
      font-weight: 800;
      z-index: 1;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-edit-button {
      position: absolute;
      right: 6px;
      bottom: 6px;
      z-index: 2;
      display: grid;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgb(255 255 255 / 94%);
      color: #46536a;
      font-size: 15px;
      box-shadow: 0 2px 8px #0002;
      opacity: .88;
      cursor: pointer;
      transition: opacity .15s, background .15s;
    }

    .avatar-edit-button:hover {
      background: white;
      opacity: 1;
    }

    .avatar-edit-button[hidden],
    .cover-edit-button[hidden],
    .rank-emblem[hidden] {
      display: none;
    }

    .identity { min-width: 0; }

    .identity-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    .rank-emblem {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border: 1px solid #f0d48d;
      border-radius: 50%;
      background: var(--gold-light);
      font-size: 1.45rem;
      box-shadow: 0 2px 8px #24345a12;
    }

    .member-date {
      margin: 4px 0 10px;
      color: var(--muted);
    }

    .rank {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid #cbd8ff;
      border-radius: 999px;
      background: var(--blue-light);
      color: #3153b8;
      font-size: .9rem;
      font-weight: 700;
    }

    #image-controls[hidden] { display: none; }
    #image-controls input { display: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .stat {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .stat-label {
      color: var(--muted);
      font-size: .9rem;
    }

    .stat-value {
      display: block;
      margin-top: 4px;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .achievements {
      margin-top: 18px;
      padding: 22px;
    }

    .achievements h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }

    .achievement-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .achievement {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfe;
    }

    .achievement.unlocked {
      border-color: #f0d48d;
      background: var(--gold-light);
    }

    .achievement-icon {
      display: block;
      margin-bottom: 6px;
      font-size: 1.5rem;
    }

    .achievement p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .status {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .status.error { color: var(--danger); }

    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .cover { height: 145px; }

      .profile {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 0 18px 20px;
      }

      .achievement-list { grid-template-columns: 1fr; }
      .achievements { padding: 18px; }

      .cover-edit-button {
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back-link" href="index.html">← Volver al foro</a>

    <section class="card">
      <div class="cover">
        <img
          class="cover-image"
          id="cover-image"
          alt="Imagen de portada del perfil"
          hidden
        >

        <div class="cover-shade" aria-hidden="true"></div>

        <button
          class="cover-edit-button"
          id="cover-edit-button"
          type="button"
          title="Cambiar imagen de portada"
          hidden
        >🖼️ Cambiar portada</button>
      </div>

      <div class="profile">
        <div class="avatar-wrap">
          <span id="avatar-fallback">?</span>

          <img id="avatar" alt="" hidden>

          <button
            class="avatar-edit-button"
            id="avatar-edit-button"
            type="button"
            aria-label="Cambiar foto de perfil"
            title="Cambiar foto"
            hidden
          >📷</button>
        </div>

        <div class="identity">
          <div class="identity-title">
            <h1 id="username">Cargando perfil…</h1>
            <span
              class="rank-emblem"
              id="rank-emblem"
              role="img"
              aria-label="Emblema de rango"
              hidden
            ></span>
          </div>

          <p class="member-date" id="member-date"></p>
          <span class="rank" id="rank">Calculando rango…</span>
        </div>
      </div>
    </section>

    <div id="image-controls" hidden>
      <input
        id="avatar-input"
        type="file"
        accept="image/*"
      >

      <input
        id="cover-input"
        type="file"
        accept="image/*"
      >
    </div>

    <section class="stats" aria-label="Estadísticas del perfil">
      <div class="stat">
        <span class="stat-label">Posts creados</span>
        <strong class="stat-value" id="post-count">—</strong>
      </div>

      <div class="stat">
        <span class="stat-label">Rango actual</span>
        <strong class="stat-value" id="rank-stat">—</strong>
      </div>
    </section>

    <section class="card achievements">
      <h2>Logros</h2>
      <div class="achievement-list" id="achievement-list"></div>
    </section>

    <p class="status" id="status" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    const STORAGE_BUCKET = "avatars";
    const MAX_IMAGE_SIZE = 3 * 1024 * 1024;

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const status = document.getElementById("status");
    const usernameElement = document.getElementById("username");
    const imageControls = document.getElementById("image-controls");

    const avatarInput = document.getElementById("avatar-input");
    const avatarEditButton = document.getElementById("avatar-edit-button");

    const coverInput = document.getElementById("cover-input");
    const coverEditButton = document.getElementById("cover-edit-button");

    let currentUser = null;
    let currentProfile = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function showAvatar(url, username) {
      const fallback = document.getElementById("avatar-fallback");
      const avatar = document.getElementById("avatar");

      fallback.textContent = username.charAt(0).toUpperCase();

      if (!url) {
        avatar.removeAttribute("src");
        avatar.hidden = true;
        fallback.hidden = false;
        return;
      }

      avatar.onerror = () => {
        avatar.hidden = true;
        fallback.hidden = false;
      };

      avatar.alt = `Avatar de ${username}`;
      avatar.src = url;
      avatar.hidden = false;
      fallback.hidden = true;
    }

    function showCover(url) {
      const coverImage = document.getElementById("cover-image");

      if (!url) {
        coverImage.removeAttribute("src");
        coverImage.hidden = true;
        return;
      }

      coverImage.onerror = () => {
        coverImage.hidden = true;
      };

      coverImage.src = url;
      coverImage.hidden = false;
    }

    function getOwnStoragePath(publicUrl, userId) {
      const prefix =
        `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/`;

      if (!publicUrl?.startsWith(prefix)) return null;

      try {
        const path = decodeURIComponent(publicUrl.slice(prefix.length));
        return path.startsWith(`${userId}/`) ? path : null;
      } catch {
        return null;
      }
    }

    async function uploadProfileImage(file, type) {
      const isAvatar = type === "avatar";
      const input = isAvatar ? avatarInput : coverInput;
      const button = isAvatar ? avatarEditButton : coverEditButton;

      if (!file || !currentUser || !currentProfile) return;

      const extensions = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp"
      };

      const extension = extensions[file.type];

      if (!extension) {
        showStatus(
          "El archivo debe ser JPEG, PNG o WebP. Si es una foto HEIC del móvil, conviértela a uno de esos formatos.",
          true
        );
        input.value = "";
        return;
      }

      if (file.size > MAX_IMAGE_SIZE) {
        showStatus("La imagen supera el límite de 3 MB.", true);
        input.value = "";
        return;
      }

      button.disabled = true;
      button.textContent = "Subiendo…";

      try {
        const column = isAvatar ? "avatar_url" : "cover_url";
        const oldPath = getOwnStoragePath(
          currentProfile[column],
          currentUser.id
        );

        const filePrefix = isAvatar ? "" : "cover-";
        const fileName =
          `${filePrefix}${crypto.randomUUID()}.${extension}`;
        const storagePath = `${currentUser.id}/${fileName}`;

        const { error: uploadError } = await supabase.storage
          .from(STORAGE_BUCKET)
          .upload(storagePath, file, {
            cacheControl: "3600",
            contentType: file.type,
            upsert: false
          });

        if (uploadError) throw uploadError;

        const rpcName = isAvatar
          ? "forum_set_my_avatar_path"
          : "forum_set_my_cover_path";

        const rpcArgument = isAvatar
          ? { p_avatar_path: storagePath }
          : { p_cover_path: storagePath };

        const { error: updateError } = await supabase.rpc(
          rpcName,
          rpcArgument
        );

        if (updateError) {
          await supabase.storage
            .from(STORAGE_BUCKET)
            .remove([storagePath]);

          throw updateError;
        }

        const { data: publicUrlData } = supabase.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(storagePath);

        currentProfile[column] = publicUrlData.publicUrl;

        if (isAvatar) {
          showAvatar(
            currentProfile.avatar_url,
            currentProfile.username || "Jugador"
          );
        } else {
          showCover(currentProfile.cover_url);
        }

        if (oldPath && oldPath !== storagePath) {
          const { error: removeError } = await supabase.storage
            .from(STORAGE_BUCKET)
            .remove([oldPath]);

          if (removeError) {
            console.warn(
              "No se pudo eliminar la imagen anterior:",
              removeError
            );
          }
        }

        showStatus(
          isAvatar
            ? "La foto de perfil se actualizó correctamente."
            : "La imagen de portada se actualizó correctamente."
        );
      } catch (error) {
        console.error("Error subiendo la imagen:", error);
        showStatus(
          "No se pudo subir la imagen. Revisa la sesión y vuelve a intentarlo.",
          true
        );
      } finally {
        button.disabled = false;
        button.textContent = isAvatar
          ? "📷"
          : "🖼️ Cambiar portada";
        input.value = "";
      }
    }

    avatarEditButton.addEventListener("click", () => {
      if (currentUser && currentProfile) avatarInput.click();
    });

    coverEditButton.addEventListener("click", () => {
      if (currentUser && currentProfile) coverInput.click();
    });

    avatarInput.addEventListener("change", () => {
      uploadProfileImage(avatarInput.files?.[0], "avatar");
    });

    coverInput.addEventListener("change", () => {
      uploadProfileImage(coverInput.files?.[0], "cover");
    });

    async function loadProfile() {
      try {
        const {
          data: { user },
          error: authError
        } = await supabase.auth.getUser();

        if (authError) throw authError;

        if (!user) {
          usernameElement.textContent = "Inicia sesión para ver tu perfil";
          showStatus(
            "No hay una sesión activa. Inicia sesión y vuelve a esta página."
          );
          return;
        }

        currentUser = user;

        const [profileResult, postsResult] = await Promise.all([
          supabase
            .from("usuarios_foro")
            .select("username, avatar_url, cover_url, registrado_el")
            .eq("auth_user_id", user.id)
            .maybeSingle(),

          supabase
            .from("posts")
            .select("id", { count: "exact", head: true })
            .eq("author_id", user.id)
        ]);

        if (profileResult.error) throw profileResult.error;
        if (postsResult.error) throw postsResult.error;

        currentProfile = profileResult.data;

        if (!currentProfile) {
          usernameElement.textContent = "Perfil no encontrado";
          showStatus("Aún no existe una fila de perfil para este usuario.");
          return;
        }

        imageControls.hidden = false;
        avatarEditButton.hidden = false;
        coverEditButton.hidden = false;

        const username = currentProfile.username || "Jugador";
        const postCount = postsResult.count ?? 0;

        usernameElement.textContent = username;
        document.getElementById("post-count").textContent = postCount;

        showAvatar(currentProfile.avatar_url, username);
        showCover(currentProfile.cover_url);

        if (currentProfile.registrado_el) {
          const date = new Intl.DateTimeFormat("es", {
            dateStyle: "long"
          }).format(new Date(currentProfile.registrado_el));

          document.getElementById("member-date").textContent =
            `Miembro desde ${date}`;
        } else {
          document.getElementById("member-date").textContent = "Perfil del foro";
        }

        let rankInfo;

        if (postCount >= 50) {
          rankInfo = { name: "Leyenda", emblem: "🏆" };
        } else if (postCount >= 20) {
          rankInfo = { name: "Veterano", emblem: "🛡️" };
        } else if (postCount >= 5) {
          rankInfo = { name: "Participante", emblem: "⭐" };
        } else if (postCount >= 1) {
          rankInfo = { name: "Explorador", emblem: "🧭" };
        } else {
          rankInfo = { name: "Novato", emblem: "🌱" };
        }

        const rankEmblem = document.getElementById("rank-emblem");
        rankEmblem.textContent = rankInfo.emblem;
        rankEmblem.title = `Emblema: ${rankInfo.name}`;
        rankEmblem.setAttribute(
          "aria-label",
          `Emblema del rango ${rankInfo.name}`
        );
        rankEmblem.hidden = false;

        document.getElementById("rank").textContent =
          `Rango: ${rankInfo.name}`;
        document.getElementById("rank-stat").textContent = rankInfo.name;

        const achievements = [
          {
            name: "Primer post",
            description: "Crear tu primera publicación",
            goal: 1,
            icon: "✍️"
          },
          {
            name: "Conversador",
            description: "Crear 10 publicaciones",
            goal: 10,
            icon: "💬"
          },
          {
            name: "Veterano",
            description: "Crear 50 publicaciones",
            goal: 50,
            icon: "🏆"
          }
        ];

        document.getElementById("achievement-list").innerHTML =
          achievements.map(item => {
            const unlocked = postCount >= item.goal;

            return `
              <article class="achievement ${unlocked ? "unlocked" : ""}">
                <span class="achievement-icon">
                  ${unlocked ? item.icon : "🔒"}
                </span>
                <strong>${item.name}</strong>
                <p>${item.description}</p>
                <p>${unlocked
                  ? "Desbloqueado"
                  : `Progreso: ${postCount}/${item.goal}`}
                </p>
              </article>
            `;
          }).join("");

        showStatus("");
      } catch (error) {
        console.error("Error cargando el perfil:", error);
        usernameElement.textContent = "No se pudo cargar el perfil";
        showStatus(
          "Revisa la sesión y la configuración de la cuenta.",
          true
        );
      }
    }

    loadProfile();
  </script>
</body>
</html>
