<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | Foro</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #20283a;
      --muted: #6d778b;
      --line: #e4e9f1;
      --blue: #4169e1;
      --blue-light: #edf2ff;
      --gold-light: #fff5dc;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    .page {
      width: min(920px, 100%);
      margin: auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 30px #24345a0d;
    }

    .cover {
      height: 150px;
      background: linear-gradient(120deg, #dce8ff, #e8f8fb);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 26px 24px;
    }

    .avatar-wrap {
      display: grid;
      width: 100px;
      height: 100px;
      margin-top: -38px;
      flex: 0 0 100px;
      place-items: center;
      overflow: hidden;
      border: 5px solid white;
      border-radius: 50%;
      background: #dfe8ff;
      color: var(--blue);
      font-size: 2rem;
      font-weight: 800;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .identity { min-width: 0; }

    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    .member-date {
      margin: 4px 0 10px;
      color: var(--muted);
    }

    .rank {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid #cbd8ff;
      border-radius: 999px;
      background: var(--blue-light);
      color: #3153b8;
      font-size: .9rem;
      font-weight: 700;
    }

    .profile-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 26px 22px;
    }

    .profile-actions[hidden] { display: none; }

    .profile-actions input[type="file"] {
      max-width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    button {
      padding: 10px 15px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .upload-help {
      width: 100%;
      margin: 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .stat {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .stat-label {
      color: var(--muted);
      font-size: .9rem;
    }

    .stat-value {
      display: block;
      margin-top: 4px;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .achievements {
      margin-top: 18px;
      padding: 22px;
    }

    .achievements h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }

    .achievement-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .achievement {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfe;
    }

    .achievement.unlocked {
      border-color: #f0d48d;
      background: var(--gold-light);
    }

    .achievement-icon {
      display: block;
      margin-bottom: 6px;
      font-size: 1.5rem;
    }

    .achievement p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .status {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .status.error { color: var(--danger); }

    @media (max-width: 600px) {
      .profile {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 0 18px 20px;
      }

      .profile-actions { padding: 0 18px 20px; }
      .achievement-list { grid-template-columns: 1fr; }
      .achievements { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back-link" href="index.html">← Volver al foro</a>

    <section class="card">
      <div class="cover" aria-hidden="true"></div>

      <div class="profile">
        <div class="avatar-wrap">
          <span id="avatar-fallback">?</span>
          <img id="avatar" alt="" hidden>
        </div>

        <div class="identity">
          <h1 id="username">Cargando perfil…</h1>
          <p class="member-date" id="member-date"></p>
          <span class="rank" id="rank">Calculando rango…</span>
        </div>
      </div>

      <div class="profile-actions" id="avatar-controls" hidden>
        <label for="avatar-input"><strong>Cambiar foto de perfil</strong></label>
        <input
          id="avatar-input"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >
        <button id="upload-avatar" type="button" disabled>
          Subir imagen
        </button>
        <p class="upload-help">JPEG, PNG o WebP; máximo 3 MB.</p>
      </div>
    </section>

    <section class="stats" aria-label="Estadísticas del perfil">
      <div class="stat">
        <span class="stat-label">Posts creados</span>
        <strong class="stat-value" id="post-count">—</strong>
      </div>

      <div class="stat">
        <span class="stat-label">Rango actual</span>
        <strong class="stat-value" id="rank-stat">—</strong>
      </div>
    </section>

    <section class="card achievements">
      <h2>Logros</h2>
      <div class="achievement-list" id="achievement-list"></div>
    </section>

    <p class="status" id="status" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";
    const AVATAR_BUCKET = "avatars";
    const MAX_AVATAR_SIZE = 3 * 1024 * 1024;

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const status = document.getElementById("status");
    const usernameElement = document.getElementById("username");
    const avatarInput = document.getElementById("avatar-input");
    const uploadButton = document.getElementById("upload-avatar");
    const avatarControls = document.getElementById("avatar-controls");

    let currentUser = null;
    let currentProfile = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function showAvatar(url, username) {
      const fallback = document.getElementById("avatar-fallback");
      const avatar = document.getElementById("avatar");

      fallback.textContent = username.charAt(0).toUpperCase();

      if (!url) {
        avatar.removeAttribute("src");
        avatar.hidden = true;
        fallback.hidden = false;
        return;
      }

      avatar.onerror = () => {
        avatar.hidden = true;
        fallback.hidden = false;
      };

      avatar.alt = `Avatar de ${username}`;
      avatar.src = url;
      avatar.hidden = false;
      fallback.hidden = true;
    }

    function getOwnAvatarPath(publicUrl, userId) {
      const prefix =
        `${SUPABASE_URL}/storage/v1/object/public/${AVATAR_BUCKET}/`;

      if (!publicUrl?.startsWith(prefix)) return null;

      try {
        const path = decodeURIComponent(publicUrl.slice(prefix.length));
        return path.startsWith(`${userId}/`) ? path : null;
      } catch {
        return null;
      }
    }

    async function loadProfile() {
      try {
        const {
          data: { user },
          error: authError
        } = await supabase.auth.getUser();

        if (authError) throw authError;

        if (!user) {
          usernameElement.textContent = "Inicia sesión para ver tu perfil";
          showStatus("No hay una sesión activa. Inicia sesión y vuelve a esta página.");
          return;
        }

        currentUser = user;

        const [profileResult, postsResult] = await Promise.all([
          supabase
            .from("usuarios_foro")
            .select("username, avatar_url, registrado_el")
            .eq("auth_user_id", user.id)
            .maybeSingle(),

          supabase
            .from("posts")
            .select("id", { count: "exact", head: true })
            .eq("author_id", user.id)
        ]);

        if (profileResult.error) throw profileResult.error;
        if (postsResult.error) throw postsResult.error;

        currentProfile = profileResult.data;

        const postCount = postsResult.count ?? 0;
        const username = currentProfile?.username || "Jugador";

        usernameElement.textContent = username;
        document.getElementById("post-count").textContent = postCount;

        showAvatar(currentProfile?.avatar_url, username);

        if (currentProfile?.registrado_el) {
          const date = new Intl.DateTimeFormat("es", {
            dateStyle: "long"
          }).format(new Date(currentProfile.registrado_el));

          document.getElementById("member-date").textContent =
            `Miembro desde ${date}`;
        } else {
          document.getElementById("member-date").textContent = "Perfil del foro";
        }

        const rank =
          postCount >= 50 ? "Leyenda" :
          postCount >= 20 ? "Veterano" :
          postCount >= 5  ? "Participante" :
          postCount >= 1  ? "Explorador" :
                            "Novatoo";

        document.getElementById("rank").textContent = `Rango: ${rank}`;
        document.getElementById("rank-stat").textContent = rank;

        const achievements = [
          {
            name: "Primer post",
            description: "Crear tu primera publicación",
            goal: 1,
            icon: "✍️"
          },
          {
            name: "Conversador",
            description: "Crear 10 publicaciones",
            goal: 10,
            icon: "💬"
          },
          {
            name: "Veterano",
            description: "Crear 50 publicaciones",
            goal: 50,
            icon: "🏆"
          }
        ];

        document.getElementById("achievement-list").innerHTML =
          achievements.map(item => {
            const unlocked = postCount >= item.goal;

            return `
              <article class="achievement ${unlocked ? "unlocked" : ""}">
                <span class="achievement-icon">
                  ${unlocked ? item.icon : "🔒"}
                </span>
                <strong>${item.name}</strong>
                <p>${item.description}</p>
                <p>${unlocked
                  ? "Desbloqueado"
                  : `Progreso: ${postCount}/${item.goal}`}
                </p>
              </article>
            `;
          }).join("");

        if (currentProfile) {
          avatarControls.hidden = false;
          showStatus("");
        } else {
          avatarControls.hidden = true;
          showStatus("Aún no existe una fila de perfil para este usuario.");
        }
      } catch (error) {
        console.error("Error cargando el perfil:", error);
        usernameElement.textContent = "No se pudo cargar el perfil";
        showStatus("Revisa la sesión y la configuración de Supabase.", true);
      }
    }

    avatarInput.addEventListener("change", () => {
      uploadButton.disabled = !avatarInput.files?.length;
      showStatus("");
    });

    uploadButton.addEventListener("click", async () => {
      const file = avatarInput.files?.[0];

      if (!file || !currentUser || !currentProfile) {
        showStatus("Inicia sesión y selecciona una imagen.", true);
        return;
      }

      const extensions = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp"
      };

      const extension = extensions[file.type];

      if (!extension) {
        showStatus("Elige una imagen JPEG, PNG o WebP.", true);
        return;
      }

      if (file.size > MAX_AVATAR_SIZE) {
        showStatus("La imagen supera el límite de 3 MB.", true);
        return;
      }

      uploadButton.disabled = true;
      avatarInput.disabled = true;
      uploadButton.textContent = "Subiendo…";

      let uploadedPath = null;

      try {
        const oldAvatarPath = getOwnAvatarPath(
          currentProfile.avatar_url,
          currentUser.id
        );

        uploadedPath =
          `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

        const { error: uploadError } = await supabase.storage
          .from(AVATAR_BUCKET)
          .upload(uploadedPath, file, {
            cacheControl: "3600",
            contentType: file.type,
            upsert: false
          });

        if (uploadError) throw uploadError;

        const { error: updateError } = await supabase.rpc(
          "forum_set_my_avatar_path",
          { p_avatar_path: uploadedPath }
        );

        if (updateError) {
          await supabase.storage
            .from(AVATAR_BUCKET)
            .remove([uploadedPath]);
          uploadedPath = null;
          throw updateError;
        }

        const { data: publicUrlData } = supabase.storage
          .from(AVATAR_BUCKET)
          .getPublicUrl(uploadedPath);

        currentProfile.avatar_url = publicUrlData.publicUrl;
        showAvatar(currentProfile.avatar_url, currentProfile.username || "Jugador");

        if (oldAvatarPath && oldAvatarPath !== uploadedPath) {
          const { error: removeError } = await supabase.storage
            .from(AVATAR_BUCKET)
            .remove([oldAvatarPath]);

          if (removeError) {
            console.warn("No se pudo eliminar el avatar anterior:", removeError);
          }
        }

        avatarInput.value = "";
        showStatus("La foto de perfil se actualizó correctamente.");
      } catch (error) {
        console.error("Error subiendo el avatar:", error);
        showStatus("No se pudo subir la imagen. Revisa la sesión y vuelve a intentarlo.", true);
      } finally {
        uploadButton.disabled = true;
        avatarInput.disabled = false;
        uploadButton.textContent = "Subir imagen";
      }
    });

    loadProfile();
  </script>
</body>
</html>
