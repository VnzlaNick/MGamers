<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil del jugador</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d14;
      --panel: #141824;
      --text: #f4f5fb;
      --muted: #a5abc0;
      --line: #292e40;
      --accent: #a78bfa;
      --cyan: #67e8f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse at top, #242044 0, transparent 45%),
        var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    .profile-page {
      width: min(900px, 100%);
      margin: auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--cyan);
      text-decoration: none;
    }

    .profile-card,
    .posts-section {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 16px 50px #0005;
    }

    .cover {
      height: 170px;
      background:
        radial-gradient(circle at 80% 20%, #67e8f955, transparent 25%),
        linear-gradient(120deg, #352267, #171d36 60%, #102b35);
    }

    .profile-info {
      display: flex;
      align-items: end;
      gap: 20px;
      padding: 0 28px 26px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin-top: -52px;
      border: 5px solid var(--panel);
      border-radius: 50%;
      background: #252b3b;
      object-fit: cover;
    }

    .identity { flex: 1; }

    .identity h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      overflow-wrap: anywhere;
    }

    .member-date {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 11px;
      border: 1px solid #a78bfa66;
      border-radius: 999px;
      color: #d9ccff;
      background: #a78bfa18;
      font-size: 0.85rem;
    }

    .posts-section {
      margin-top: 22px;
      padding: 24px;
    }

    .posts-section h2 {
      margin: 0 0 16px;
      font-size: 1.25rem;
    }

    .empty-state {
      padding: 28px 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 560px) {
      body { padding: 20px 12px; }
      .cover { height: 130px; }
      .profile-info {
        align-items: center;
        flex-direction: column;
        gap: 10px;
        padding: 0 18px 22px;
        text-align: center;
      }
      .avatar { margin-top: -50px; }
      .posts-section { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="profile-page">
    <a class="back-link" href="index.html">← Volver al foro</a>

    <section class="profile-card" aria-labelledby="username">
      <div class="cover" aria-hidden="true"></div>

      <div class="profile-info">
        <!-- Sustituye estos valores con los datos de usuarios_foro -->
        <img
          class="avatar"
          src="URL_DEL_AVATAR"
          alt="Avatar de NOMBRE_DE_USUARIO"
        >

        <div class="identity">
          <h1 id="username">NOMBRE_DE_USUARIO</h1>
          <p class="member-date">Miembro desde FECHA_DE_REGISTRO</p>
          <span class="badge">Jugador de MGamers</span>
        </div>
      </div>
    </section>

    <section class="posts-section" aria-labelledby="posts-title">
      <h2 id="posts-title">Publicaciones</h2>
      <div class="empty-state">
        Todavía no hay publicaciones para mostrar.
      </div>
      <!-- Aquí se mostrarán los posts de public.posts de este usuario -->
    </section>
  </main>
</body>
</html>
