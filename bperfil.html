<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | Foro</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #20283a;
      --muted: #6d778b;
      --line: #e4e9f1;
      --blue: #4169e1;
      --blue-light: #edf2ff;
      --gold: #a86d00;
      --gold-light: #fff5dc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    .page {
      width: min(920px, 100%);
      margin: auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 30px #24345a0d;
    }

    .cover {
      height: 150px;
      background: linear-gradient(120deg, #dce8ff, #e8f8fb);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 26px 24px;
    }

    .avatar-wrap {
      display: grid;
      width: 100px;
      height: 100px;
      margin-top: -38px;
      flex: 0 0 100px;
      place-items: center;
      overflow: hidden;
      border: 5px solid white;
      border-radius: 50%;
      background: #dfe8ff;
      color: var(--blue);
      font-size: 2rem;
      font-weight: 800;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .identity { min-width: 0; }

    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    .member-date {
      margin: 4px 0 10px;
      color: var(--muted);
    }

    .rank {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid #cbd8ff;
      border-radius: 999px;
      background: var(--blue-light);
      color: #3153b8;
      font-size: .9rem;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .stat {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .stat-label {
      color: var(--muted);
      font-size: .9rem;
    }

    .stat-value {
      display: block;
      margin-top: 4px;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .achievements {
      margin-top: 18px;
      padding: 22px;
    }

    .achievements h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }

    .achievement-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .achievement {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfe;
    }

    .achievement.unlocked {
      border-color: #f0d48d;
      background: var(--gold-light);
    }

    .achievement-icon {
      display: block;
      margin-bottom: 6px;
      font-size: 1.5rem;
    }

    .achievement p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .status {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      .profile {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 0 18px 20px;
      }

      .achievement-list { grid-template-columns: 1fr; }
      .achievements { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back-link" href="index.html">← Volver al foro</a>

    <section class="card">
      <div class="cover" aria-hidden="true"></div>

      <div class="profile">
        <div class="avatar-wrap">
          <span id="avatar-fallback">?</span>
          <img id="avatar" alt="" hidden>
        </div>

        <div class="identity">
          <h1 id="username">Cargando perfil…</h1>
          <p class="member-date" id="member-date"></p>
          <span class="rank" id="rank">Calculando rango…</span>
        </div>
      </div>
    </section>

    <section class="stats" aria-label="Estadísticas del perfil">
      <div class="stat">
        <span class="stat-label">Posts creados</span>
        <strong class="stat-value" id="post-count">—</strong>
      </div>
      <div class="stat">
        <span class="stat-label">Rango actual</span>
        <strong class="stat-value" id="rank-stat">—</strong>
      </div>
    </section>

    <section class="card achievements">
      <h2>Logros</h2>
      <div class="achievement-list" id="achievement-list"></div>
    </section>

    <p class="status" id="status"></p>
  </main>

  <script>
    async function loadProfile() {
      const status = document.getElementById("status");

      try {
        // Usa el cliente Supabase que ya inicializaste en tu página.
        const { data: { user }, error: authError } = await supabase.auth.getUser();

        if (authError || !user) {
          document.getElementById("username").textContent = "Inicia sesión para ver tu perfil";
          status.textContent = "No se encontró una sesión activa.";
          return;
        }

        const [profileResult, postsResult] = await Promise.all([
          supabase
            .from("usuarios_foro")
            .select("username, avatar_url, registrado_el")
            .eq("auth_user_id", user.id)
            .maybeSingle(),

          supabase
            .from("posts")
            .select("id", { count: "exact", head: true })
            .eq("author_id", user.id)
        ]);

        if (profileResult.error) throw profileResult.error;
        if (postsResult.error) throw postsResult.error;

        const profile = profileResult.data;
        const postCount = postsResult.count ?? 0;
        const username = profile?.username || "Jugador";

        document.getElementById("username").textContent = username;
        document.getElementById("post-count").textContent = postCount;

        const fallback = document.getElementById("avatar-fallback");
        const avatar = document.getElementById("avatar");
        fallback.textContent = username.charAt(0).toUpperCase();

        if (profile?.avatar_url) {
          avatar.src = profile.avatar_url;
          avatar.alt = `Avatar de ${username}`;
          avatar.hidden = false;
          fallback.hidden = true;
        }

        if (profile?.registrado_el) {
          const date = new Intl.DateTimeFormat("es", { dateStyle: "long" })
            .format(new Date(profile.registrado_el));
          document.getElementById("member-date").textContent = `Miembro desde ${date}`;
        } else {
          document.getElementById("member-date").textContent = "Perfil del foro";
        }

        const rank =
          postCount >= 50 ? "Leyenda" :
          postCount >= 20 ? "Veterano" :
          postCount >= 5  ? "Participante" :
          postCount >= 1  ? "Explorador" :
                            "Novato";

        document.getElementById("rank").textContent = `Rango: ${rank}`;
        document.getElementById("rank-stat").textContent = rank;

        const achievements = [
          { name: "Primer post", description: "Crear tu primera publicación", goal: 1, icon: "✍️" },
          { name: "Conversador", description: "Crear 10 publicaciones", goal: 10, icon: "💬" },
          { name: "Veterano", description: "Crear 50 publicaciones", goal: 50, icon: "🏆" }
        ];

        document.getElementById("achievement-list").innerHTML =
          achievements.map(item => {
            const unlocked = postCount >= item.goal;
            return `
              <article class="achievement ${unlocked ? "unlocked" : ""}">
                <span class="achievement-icon">${unlocked ? item.icon : "🔒"}</span>
                <strong>${item.name}</strong>
                <p>${item.description}</p>
                <p>${unlocked ? "Desbloqueado" : `Progreso: ${postCount}/${item.goal}`}</p>
              </article>
            `;
          }).join("");

        if (!profile) {
          status.textContent = "Aún no existe una fila de perfil para este usuario.";
        }
      } catch (error) {
        console.error("Error cargando el perfil:", error);
        status.textContent = "No se pudo cargar el perfil. Revisa la conexión y los permisos.";
      }
    }

    loadProfile();
  </script>
</body>
</html>
