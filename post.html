<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>Crear publicación | Móvil Gamers</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d18;
      color: #eef2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse at top, rgba(37, 99, 235, .18), transparent 55%),
        #090d18;
    }

    .container {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .header a {
      color: #a9b8d4;
      text-decoration: none;
      font-size: 14px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 6vw, 32px);
    }

    .subtitle, .auth-status {
      color: #9aa8c2;
      line-height: 1.5;
    }

    .card {
      padding: clamp(18px, 5vw, 28px);
      border: 1px solid #26334c;
      border-radius: 18px;
      background: rgba(16, 24, 40, .94);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
    }

    .field {
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #c7d2e8;
      font-size: 13px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #34435d;
      border-radius: 10px;
      padding: 12px;
      background: #0b1220;
      color: #eef2ff;
      font: inherit;
      font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 1px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .help {
      margin: 7px 0 0;
      color: #8998b2;
      font-size: 12px;
      line-height: 1.45;
    }

    .image-picker {
      display: block;
      padding: 14px;
      border: 1px dashed #486187;
      border-radius: 12px;
      background: #0b1220;
    }

    .image-picker input {
      padding: 8px;
      border: 0;
      background: transparent;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 360px;
      margin-top: 12px;
      object-fit: contain;
      border-radius: 12px;
      background: #05080e;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      border: 1px solid #7f1d1d;
      background: #351316;
      color: #fecaca;
    }

    .message.success {
      display: block;
      border: 1px solid #166534;
      background: #10291c;
      color: #bbf7d0;
    }

    .submit {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .success-link {
      display: inline-block;
      margin-top: 8px;
      color: #bfdbfe;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      body { padding: 16px 12px; }
      .header { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="header">
      <a href="index.html">← Volver al foro</a>
      <a href="inres.html">Cuenta</a>
    </div>

    <section class="card">
      <h1>Crear publicación</h1>
      <p class="subtitle">Comparte un tema con la comunidad gamer.</p>
      <p id="auth-status" class="auth-status">Verificando sesión…</p>

      <form id="form-post">
        <div class="field">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="noticias">Noticias y Anuncios</option>
            <option value="torneos">Torneos</option>
            <option value="descargas-juegos">Descargas Juegos</option>
            <option value="servidores-mu">Servidores Mu</option>
            <option value="blood-strike">Blood Strike</option>
            <option value="free-fire">Free Fire</option>
            <option value="mobile-legends">Mobile Legends</option>
            <option value="brawl-star">Brawl Star</option>
            <option value="gounbound-m">Gounbound M</option>
            <option value="zona-pokemon">Zona Pokemon</option>
            <option value="minecraft">Minecraft</option>
            <option value="zona-dino">Zona Dino</option>
            <option value="zona-simuladores">Zona Simuladores</option>
            <option value="zona-libre">Zona Libre</option>
            <option value="guia-trucos">Guía, Trucos</option>
          </select>
        </div>

        <div class="field">
          <label for="tipo">Tipo de publicación</label>
          <select id="tipo">
            <option value="General">General</option>
            <option value="Guías">Guías</option>
            <option value="Builds">Builds</option>
            <option value="Bugs">Bugs</option>
          </select>
        </div>

        <div class="field">
          <label for="titulo">Título</label>
          <input
            id="titulo"
            type="text"
            maxlength="160"
            placeholder="Ej.: Busco equipo para el torneo"
            required
          >
        </div>

        <div class="field">
          <label for="contenido">Contenido</label>
          <textarea
            id="contenido"
            maxlength="10000"
            placeholder="Escribe los detalles de tu publicación…"
            required
          ></textarea>
        </div>

        <div class="field">
          <label for="imagen">Imagen (opcional)</label>
          <div class="image-picker">
            <input
              id="imagen"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
              capture="environment"
            >
            <p class="help">
              Puedes elegir una imagen del teléfono o tomar una foto.
              Máximo 5 MB. Formatos: JPG, PNG, WEBP, GIF o AVIF.
            </p>
          </div>
          <img id="preview" class="preview" alt="Vista previa de la imagen">
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <button id="submit-button" class="submit" type="submit">
          Publicar tema
        </button>
      </form>
    </section>
  </main>

  <script type="module">
    import { supabase } from './conexion.js';

    const BUCKET = 'post-images';
    const MAX_IMAGE_SIZE = 5 * 1024 * 1024;

    const extensions = {
      'image/jpeg': 'jpg',
      'image/png': 'png',
      'image/webp': 'webp',
      'image/gif': 'gif',
      'image/avif': 'avif'
    };

    const form = document.getElementById('form-post');
    const imageInput = document.getElementById('imagen');
    const preview = document.getElementById('preview');
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submit-button');
    const authStatus = document.getElementById('auth-status');

    let canPost = false;
    let previewUrl = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function clearMessage() {
      message.textContent = '';
      message.className = 'message';
    }

    function clearPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      preview.removeAttribute('src');
      preview.style.display = 'none';
    }

    imageInput.addEventListener('change', () => {
      clearMessage();
      clearPreview();

      const file = imageInput.files?.[0];
      if (!file) return;

      if (!extensions[file.type]) {
        imageInput.value = '';
        showMessage(
          'Formato no admitido. Usa JPG, PNG, WEBP, GIF o AVIF.',
          'error'
        );
        return;
      }

      if (file.size > MAX_IMAGE_SIZE) {
        imageInput.value = '';
        showMessage('La imagen supera el máximo permitido de 5 MB.', 'error');
        return;
      }

      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.style.display = 'block';
    });

    async function checkSession() {
      submitButton.disabled = true;

      try {
        const { data, error } = await supabase.auth.getUser();

        if (error) throw error;

        canPost = Boolean(data.user);

        if (!data.user) {
          authStatus.textContent = 'Debes iniciar sesión para publicar.';
          return;
        }

        authStatus.textContent =
          `Sesión activa: ${data.user.email || 'usuario autenticado'}`;
        submitButton.disabled = false;
      } catch (error) {
        canPost = false;
        authStatus.textContent =
          'No se pudo comprobar la sesión. Vuelve a iniciar sesión.';
        console.error('Error al comprobar la sesión:', error);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage();

      const titulo = document.getElementById('titulo').value.trim();
      const contenido = document.getElementById('contenido').value.trim();
      const categoria = document.getElementById('categoria').value;
      const tipo = document.getElementById('tipo').value;
      const file = imageInput.files?.[0] ?? null;

      if (!titulo || !contenido || !categoria) {
        showMessage(
          'Completa la categoría, el título y el contenido.',
          'error'
        );
        return;
      }

      if (file && (!extensions[file.type] || file.size > MAX_IMAGE_SIZE)) {
        showMessage(
          'La imagen debe ser válida y no superar 5 MB.',
          'error'
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = file
        ? 'Subiendo imagen y publicando…'
        : 'Publicando…';

      let uploadedPath = null;

      try {
        const { data: authData, error: authError } =
          await supabase.auth.getUser();

        if (authError) throw authError;

        const user = authData.user;

        if (!user) {
          canPost = false;
          authStatus.textContent = 'Debes iniciar sesión para publicar.';
          throw new Error('Inicia sesión antes de publicar.');
        }

        canPost = true;

        let imageUrl = null;

        if (file) {
          const extension = extensions[file.type];
          uploadedPath = `${user.id}/${crypto.randomUUID()}.${extension}`;

          const { error: uploadError } = await supabase.storage
            .from(BUCKET)
            .upload(uploadedPath, file, {
              contentType: file.type,
              cacheControl: '3600',
              upsert: false
            });

          if (uploadError) throw uploadError;

          const { data } = supabase.storage
            .from(BUCKET)
            .getPublicUrl(uploadedPath);

          imageUrl = data.publicUrl;
        }

        const { error: insertError } = await supabase
          .from('posts')
          .insert({
            titulo,
            contenido,
            'categoría': categoria,
            tipo: tipo || null,
            image_url: imageUrl
          });

        if (insertError) throw insertError;

        form.reset();
        clearPreview();

        showMessage(
          '¡Publicación creada correctamente! Puedes volver al foro.',
          'success'
        );

        const backLink = document.createElement('a');
        backLink.href = 'index.html';
        backLink.textContent = 'Volver al foro';
        backLink.className = 'success-link';

        message.append(document.createElement('br'), backLink);
      } catch (error) {
        let cleanupFailed = false;

        if (uploadedPath) {
          try {
            const { error: removeError } = await supabase.storage
              .from(BUCKET)
              .remove([uploadedPath]);

            cleanupFailed = Boolean(removeError);
          } catch {
            cleanupFailed = true;
          }
        }

        console.error('Error al crear la publicación:', error);

        const cleanupNote = cleanupFailed
          ? ' La imagen pudo quedar en Storage porque no se pudo eliminar automáticamente.'
          : '';

        showMessage(
          `No se pudo crear la publicación: ${error.message || 'Error inesperado.'}${cleanupNote}`,
          'error'
        );
      } finally {
        submitButton.textContent = 'Publicar tema';
        submitButton.disabled = !canPost;
      }
    });

    checkSession();
  </script>
</body>
</html>
