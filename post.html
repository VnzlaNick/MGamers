<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear publicación | MGamers</title>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: #fff;
      color: #202638;
      font-family: system-ui, sans-serif;
    }

    main { width: min(100%, 780px); margin: auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    a { color: #3949ab; }

    .card, .preview-card {
      padding: clamp(18px, 5vw, 34px);
      border: 1px solid #e1e4eb;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 35px rgb(20 30 60 / 8%);
    }

    h1 { margin: 0 0 8px; }
    .intro, .hint { color: #5e6678; }

    label, .field-label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 650;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd1dc;
      border-radius: 8px;
      background: white;
      color: #202638;
      font: inherit;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .toolbar button, .file-label {
      padding: 8px 11px;
      border: 1px solid #cbd1dc;
      border-radius: 8px;
      background: #f5f6fa;
      color: #202638;
      font: inherit;
      cursor: pointer;
    }

    .toolbar button:hover, .file-label:hover { background: #e9ecf4; }

    #text-color {
      width: 42px;
      height: 38px;
      padding: 3px;
      cursor: pointer;
    }

    #font-size { width: auto; }

    #editor {
      min-height: 240px;
      padding: 14px;
      border: 1px solid #cbd1dc;
      border-radius: 10px;
      background: #fff;
      color: #202638;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #editor:focus {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }

    #editor:empty::before {
      content: attr(data-placeholder);
      color: #8b91a0;
      pointer-events: none;
    }

    #editor img, #preview-content img {
      display: block;
      max-width: 100%;
      max-height: 480px;
      margin: 10px 0;
      border-radius: 10px;
    }

    #image-input { display: none; }

    .emoji-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .emoji-list button {
      min-width: 38px;
      padding: 6px;
      border: 1px solid #cbd1dc;
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .actions button {
      padding: 12px 17px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #publish-button { background: #4f46e5; color: white; }
    #draft-button, #preview-button { background: #eef0f6; color: #202638; }
    button:disabled { opacity: .6; cursor: wait; }

    #status {
      min-height: 24px;
      color: #3949ab;
    }

    #preview {
      margin-top: 24px;
    }

    #preview[hidden] { display: none; }

    .preview-category {
      color: #5e6678;
      font-size: .9rem;
    }

    #preview-content {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <div class="topbar">
      <strong>Foro MGamers</strong>
      <a href="index.html">Inicio</a>
    </div>

    <section class="card">
      <h1>Crear publicación</h1>
      <p class="intro">Edita el texto, agrega emojis e imágenes y revisa el resultado antes de publicar.</p>

      <form id="post-form">
        <label for="post-icon">Icono de la publicación</label>
        <select id="post-icon">
          <option value="">Sin icono</option>
          <option value="🎮">🎮 Videojuegos</option>
          <option value="📢">📢 Anuncio</option>
          <option value="🏆">🏆 Torneo</option>
          <option value="💡">💡 Consejo</option>
          <option value="🛠️">🛠️ Hardware</option>
          <option value="❓">❓ Pregunta</option>
        </select>

        <label for="input-title">Título</label>
        <input id="input-title" type="text" maxlength="150" required
               placeholder="Escribe el título">

        
        <label for="select-tag">Categoría</label>
<select id="select-tag" required>
  <option value="">Selecciona una categoría</option>
  <option value="feed-noticias">Noticias</option>
  <option value="feed-mu">Servidores Mu</option>
  <option value="feed-Blood">Blood Strike</option>
  <option value="feed-Free">Free Fire</option>
  <option value="feed-mobiles">Mobile Legends</option>
  <option value="feed-brawl">Brawl Star</option>
  <option value="feed-Gounbound">Gounbound</option>
  <option value="Feed-pokemon">Zona Pokémon</option>
  <option value="feed-minicraft">Minecraft</option>
  <option value="feed-dino">Zona Dino</option>
  <option value="feed-sim">Zona Simuladores</option>
  <option value="feed-libre">Zona Libre</option>
  <option value="feed-guia">Zona Guía</option>
</select>
        
        
        
        
        
        

        <span class="field-label">Contenido</span>

        <div class="toolbar" aria-label="Formato del contenido">
          <button type="button" data-command="bold" aria-label="Negrita"><b>N</b></button>
          <button type="button" data-command="italic" aria-label="Cursiva"><i>K</i></button>
          <button type="button" data-command="underline" aria-label="Subrayado"><u>S</u></button>

          <label for="font-size" style="margin:0">Tamaño:</label>
          <select id="font-size" aria-label="Tamaño del texto">
            <option value="">Tamaño</option>
            <option value="2">Pequeño</option>
            <option value="3">Normal</option>
            <option value="4">Grande</option>
            <option value="5">Muy grande</option>
          </select>

          <label for="text-color" style="margin:0">Color:</label>
          <input id="text-color" type="color" value="#202638" aria-label="Elegir color">
          <button id="apply-color" type="button">Aplicar color</button>

          <label for="image-input" class="file-label">Insertar imagen</label>
          <input id="image-input" type="file"
                 accept="image/jpeg,image/png,image/webp,image/gif">
        </div>

        <div class="emoji-list" aria-label="Insertar emoji">
          <button type="button" data-emoji="😀">😀</button>
          <button type="button" data-emoji="😂">😂</button>
          <button type="button" data-emoji="🔥">🔥</button>
          <button type="button" data-emoji="🎮">🎮</button>
          <button type="button" data-emoji="❤️">❤️</button>
          <button type="button" data-emoji="👍">👍</button>
          <button type="button" data-emoji="🏆">🏆</button>
          <button type="button" data-emoji="⚔️">⚔️</button>
        </div>

        <div id="editor" contenteditable="true" role="textbox" aria-multiline="true"
             data-placeholder="Escribe aquí. Selecciona texto para cambiar su formato o color."></div>

        <div class="actions">
          <button id="publish-button" type="submit">Publicar</button>
          <button id="preview-button" type="button">Vista previa</button>
          <button id="draft-button" type="button">Guardar borrador</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="hint">
        Debes iniciar sesión para publicar. Las imágenes JPG, PNG, WEBP o GIF pueden tener hasta 5 MB.
      </p>
    </section>

    <section id="preview" hidden>
      <div class="preview-card">
        <span id="preview-category" class="preview-category"></span>
        <h2 id="preview-title"></h2>
        <div id="preview-content"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabase } from './conexion.js';

    const PROJECT_ORIGIN = 'https://zrrpjbqduwtaxsfbsuum.supabase.co';
    const BUCKET = 'post-images';
    const DRAFT_KEY = 'mgamers_post_draft_v3';

    const form = document.getElementById('post-form');
    const titleInput = document.getElementById('input-title');
    const categoryInput = document.getElementById('select-tag');
    const iconInput = document.getElementById('post-icon');
    const editor = document.getElementById('editor');
    const colorInput = document.getElementById('text-color');
    const sizeInput = document.getElementById('font-size');
    const imageInput = document.getElementById('image-input');
    const publishButton = document.getElementById('publish-button');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    let savedRange = null;

    function setStatus(message) {
      status.textContent = message;
    }

    function saveSelection() {
      const selection = window.getSelection();

      if (selection && selection.rangeCount && editor.contains(selection.anchorNode)) {
        savedRange = selection.getRangeAt(0).cloneRange();
      }
    }

    function restoreSelection() {
      editor.focus();
      const selection = window.getSelection();

      if (!selection) return;

      selection.removeAllRanges();

      if (savedRange && editor.contains(savedRange.commonAncestorContainer)) {
        selection.addRange(savedRange);
      } else {
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        selection.addRange(range);
      }
    }

    function insertAtCursor(node) {
      restoreSelection();

      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);

      selection.removeAllRanges();
      selection.addRange(range);
      saveSelection();
    }

    editor.addEventListener('keyup', saveSelection);
    editor.addEventListener('mouseup', saveSelection);
    editor.addEventListener('input', saveSelection);
    document.addEventListener('selectionchange', saveSelection);

    // Pegar solo texto plano, no HTML externo.
    editor.addEventListener('paste', (event) => {
      event.preventDefault();
      const text = event.clipboardData?.getData('text/plain') || '';
      insertAtCursor(document.createTextNode(text));
    });

    // Impide arrastrar contenido HTML externo al editor.
    editor.addEventListener('drop', (event) => event.preventDefault());

    document.querySelectorAll('[data-command]').forEach((button) => {
      button.addEventListener('mousedown', (event) => event.preventDefault());
      button.addEventListener('click', () => {
        restoreSelection();
        document.execCommand(button.dataset.command, false, null);
        saveSelection();
      });
    });

    document.querySelectorAll('[data-emoji]').forEach((button) => {
      button.addEventListener('mousedown', (event) => event.preventDefault());
      button.addEventListener('click', () => {
        insertAtCursor(document.createTextNode(button.dataset.emoji));
      });
    });

    function applyFontSize(size) {
      if (!size) return;

      restoreSelection();
      document.execCommand('fontSize', false, size);
      saveSelection();
    }

    sizeInput.addEventListener('mousedown', saveSelection);
    sizeInput.addEventListener('change', () => {
      applyFontSize(sizeInput.value);
      sizeInput.value = '';
    });

    document.getElementById('apply-color').addEventListener('mousedown', (event) => {
      event.preventDefault();
    });

    document.getElementById('apply-color').addEventListener('click', () => {
      restoreSelection();

      const selection = window.getSelection();
      if (!selection || selection.isCollapsed) {
        setStatus('Selecciona primero el texto al que quieres aplicar color.');
        return;
      }

      document.execCommand('styleWithCSS', false, true);
      document.execCommand('foreColor', false, colorInput.value);
      saveSelection();
      setStatus('Color aplicado al texto seleccionado.');
    });

    function convertLegacyFontTags(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const sizeMap = {
        '1': '12px',
        '2': '14px',
        '3': '16px',
        '4': '18px',
        '5': '24px',
        '6': '32px',
        '7': '48px'
      };

      doc.body.querySelectorAll('font').forEach((font) => {
        const span = doc.createElement('span');
        const size = sizeMap[font.getAttribute('size')];

        if (size) span.style.fontSize = size;

        span.innerHTML = font.innerHTML;
        font.replaceWith(span);
      });

      return doc.body.innerHTML;
    }

    DOMPurify.addHook('uponSanitizeAttribute', (node, data) => {
      if (node.nodeName === 'IMG' && data.attrName === 'src') {
        try {
          const url = new URL(data.attrValue);
          const allowed =
            url.origin === PROJECT_ORIGIN &&
            url.pathname.startsWith('/storage/v1/object/public/post-images/');

          if (!allowed) data.keepAttr = false;
        } catch {
          data.keepAttr = false;
        }
      }

      if (data.attrName === 'style') {
        const safeStyles = [];

        const color = data.attrValue.match(
          /(?:^|;)\s*color\s*:\s*(#[0-9a-f]{3,8}|rgba?\([0-9.,\s]+\))\s*(?:;|$)/i
        );

        const size = data.attrValue.match(
          /(?:^|;)\s*font-size\s*:\s*(12|14|16|18|24|32)px\s*(?:;|$)/i
        );

        if (color) safeStyles.push(`color: ${color[1]}`);
        if (size) safeStyles.push(`font-size: ${size[1]}px`);

        if (safeStyles.length) {
          data.attrValue = safeStyles.join('; ');
        } else {
          data.keepAttr = false;
        }
      }
    });

    function sanitizeContent(html) {
      return DOMPurify.sanitize(convertLegacyFontTags(html), {
        ALLOWED_TAGS: [
          'p', 'br', 'div', 'span', 'strong', 'b', 'em', 'i',
          'u', 'ul', 'ol', 'li', 'img'
        ],
        ALLOWED_ATTR: ['style', 'src', 'alt'],
        ALLOWED_URI_REGEXP:
          /^https:\/\/zrrpjbqduwtaxsfbsuum\.supabase\.co\/storage\/v1\/object\/public\/post-images\//i
      });
    }

    imageInput.addEventListener('change', async () => {
      const file = imageInput.files?.[0];
      imageInput.value = '';

      if (!file) return;

      const extensions = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp',
        'image/gif': 'gif'
      };

      if (!extensions[file.type]) {
        setStatus('Elige una imagen JPG, PNG, WEBP o GIF.');
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        setStatus('La imagen supera el límite de 5 MB.');
        return;
      }

      setStatus('Subiendo imagen…');

      try {
        const {
          data: { user },
          error: authError
        } = await supabase.auth.getUser();

        if (authError) throw authError;
        if (!user) throw new Error('Inicia sesión antes de subir imágenes.');

        const path = `${user.id}/${crypto.randomUUID()}.${extensions[file.type]}`;

        const { error: uploadError } = await supabase.storage
          .from(BUCKET)
          .upload(path, file, {
            contentType: file.type,
            cacheControl: '3600',
            upsert: false
          });

        if (uploadError) throw uploadError;

        const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
        const image = document.createElement('img');
        image.src = data.publicUrl;
        image.alt = 'Imagen de la publicación';
        image.loading = 'lazy';

        // Inserta la imagen donde estaba el cursor del editor.
        insertAtCursor(image);
        setStatus('Imagen insertada en el contenido.');
      } catch (error) {
        console.error('Error al subir la imagen:', error);
        setStatus('No se pudo subir la imagen: ' + (error.message || 'error inesperado.'));
      }
    });

    function saveDraft(showMessage = true) {
      const draft = {
        titulo: titleInput.value,
        categoria: categoryInput.value,
        icono: iconInput.value,
        contenido: editor.innerHTML
      };

      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      if (showMessage) setStatus('Borrador guardado en este navegador.');
    }

    try {
      const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');

      if (draft) {
        titleInput.value = draft.titulo || '';
        categoryInput.value = draft.categoria || '';
        iconInput.value = draft.icono || '';
        editor.innerHTML = sanitizeContent(draft.contenido || '');
      }
    } catch {
      localStorage.removeItem(DRAFT_KEY);
    }

    document.getElementById('draft-button').addEventListener('click', () => {
      saveDraft(true);
    });

    let draftTimer;
    form.addEventListener('input', () => {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(() => saveDraft(false), 700);
    });

    document.getElementById('preview-button').addEventListener('click', () => {
      const title = titleInput.value.trim();
      const icon = iconInput.value;
      const category = categoryInput.options[categoryInput.selectedIndex]?.text || '';
      const cleanContent = sanitizeContent(editor.innerHTML);

      document.getElementById('preview-title').textContent =
        `${icon ? icon + ' ' : ''}${title || 'Título de la publicación'}`;

      document.getElementById('preview-category').textContent =
        categoryInput.value ? category : 'Categoría';

      document.getElementById('preview-content').innerHTML =
        cleanContent || 'El contenido aparecerá aquí.';

      preview.hidden = !preview.hidden;

      if (!preview.hidden) {
        preview.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const titleText = titleInput.value.trim();
      const category = categoryInput.value;
      const content = sanitizeContent(editor.innerHTML);
      const hasImage = editor.querySelector('img');

      if (!titleText || !category || (!editor.innerText.trim() && !hasImage)) {
        setStatus('Completa el título, la categoría y el contenido.');
        return;
      }

      const icon = iconInput.value;
      const title = icon ? `${icon} ${titleText}` : titleText;

      publishButton.disabled = true;
      publishButton.textContent = 'Publicando…';
      setStatus('Verificando la sesión…');

      try {
        const {
          data: { user },
          error: authError
        } = await supabase.auth.getUser();

        if (authError) throw authError;
        if (!user) throw new Error('Inicia sesión antes de publicar.');

        const { error } = await supabase
          .from('posts')
          .insert({
            titulo: title,
            contenido: content,
            'categoría': category
          });

        if (error) throw error;

        localStorage.removeItem(DRAFT_KEY);
        setStatus('Publicación creada. Volviendo al foro…');
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Error al publicar:', error);
        setStatus('No se pudo publicar: ' + (error.message || 'error inesperado.'));
      } finally {
        publishButton.disabled = false;
        publishButton.textContent = 'Publicar';
      }
    });
  </script>
</body>
</html>
