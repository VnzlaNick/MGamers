<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear publicación | MGamers</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      color: #202638;
      background: #f6f7fb;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 780px);
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .card, .preview-card {
      padding: clamp(18px, 5vw, 34px);
      border: 1px solid #e1e4eb;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 35px rgb(20 30 60 / 8%);
    }

    h1 { margin: 0 0 8px; }

    .intro, .hint, .muted { color: #5e6678; }

    label, .field-label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 650;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd1dc;
      border-radius: 8px;
      background: white;
      color: #202638;
      font: inherit;
    }

    .toolbar, .emoji-list, .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .toolbar { margin: 10px 0; }

    .toolbar button, .emoji-list button, .file-label,
    .actions button, .close-button {
      padding: 9px 12px;
      border: 1px solid #cbd1dc;
      border-radius: 8px;
      background: #f5f6fa;
      color: #202638;
      font: inherit;
      cursor: pointer;
    }

    .toolbar button:hover, .emoji-list button:hover,
    .file-label:hover, .actions button:hover {
      background: #e9ecf4;
    }

    #font-size { width: auto; }

    #text-color {
      width: 44px;
      height: 40px;
      padding: 3px;
      cursor: pointer;
    }

    #image-input { display: none; }

    .emoji-list { margin: 8px 0; }

    .emoji-list button {
      min-width: 40px;
      padding: 6px;
      font-size: 20px;
    }

    #editor {
      min-height: 240px;
      padding: 14px;
      border: 1px solid #cbd1dc;
      border-radius: 10px;
      background: white;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #editor:focus {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }

    #editor:empty::before {
      content: attr(data-placeholder);
      color: #8b91a0;
      pointer-events: none;
    }

    #editor img, #preview-content img {
      display: block;
      max-width: 100%;
      max-height: 480px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .actions { margin-top: 20px; }

    .actions button {
      padding: 12px 17px;
      border: 0;
      font-weight: 700;
    }

    #publish-button {
      background: #4f46e5;
      color: white;
    }

    #preview-button, #draft-button {
      background: #eef0f6;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      color: #3949ab;
      overflow-wrap: anywhere;
    }

    #auth-warning {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fff4d6;
    }

    #preview {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgb(0 0 0 / 55%);
      overflow-y: auto;
    }

    #preview[hidden] { display: none; }

    .preview-card {
      position: relative;
      width: min(100%, 780px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
    }

    .close-button {
      float: right;
      margin-left: 12px;
    }

    .preview-category {
      color: #5e6678;
      font-size: .9rem;
    }

    #preview-content {
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    a { color: #3949ab; }
  </style>
</head>

<body>
  <main>
    <div class="topbar">
      <strong>Foro MGamers</strong>
      <a href="index.html">Inicio</a>
    </div>

    <div id="auth-warning" hidden>
      Necesitas iniciar sesión para publicar.
      <a id="login-link" href="login.html">Iniciar sesión</a>
    </div>

    <section class="card">
      <h1>Crear publicación</h1>
      <p class="intro">
        Escribe tu publicación, agrega imágenes y revisa la vista previa antes de publicarla.
      </p>

      <form id="post-form">
        <label for="post-icon">Icono</label>
        <select id="post-icon">
          <option value="">Sin icono</option>
          <option value="🎮">🎮 Videojuegos</option>
          <option value="📢">📢 Anuncio</option>
          <option value="🏆">🏆 Torneo</option>
          <option value="💡">💡 Consejo</option>
          <option value="🛠️">🛠️ Hardware</option>
          <option value="❓">❓ Pregunta</option>
        </select>

        <label for="input-title">Título</label>
        <input id="input-title" type="text" maxlength="150"
               required placeholder="Escribe el título">

        <label for="select-tag">Categoría</label>
        <select id="select-tag" required>
          <option value="">Selecciona una categoría</option>
          <option value="feed-noticias">Noticias</option>
          <option value="feed-mu">Servidores Mu</option>
          <option value="feed-Blood">Blood Strike</option>
          <option value="feed-Free">Free Fire</option>
          <option value="feed-mobiles">Mobile Legends</option>
          <option value="feed-brawl">Brawl Star</option>
          <option value="feed-Gounbound">Gounbound</option>
          <option value="Feed-pokemon">Zona Pokémon</option>
          <option value="feed-minicraft">Minecraft</option>
          <option value="feed-dino">Zona Dino</option>
          <option value="feed-sim">Zona Simuladores</option>
          <option value="feed-libre">Zona Libre</option>
          <option value="feed-guia">Zona Guía</option>
        </select>

        <label for="post-type">Tipo de publicación (opcional)</label>
        <select id="post-type">
          <option value="">Sin tipo</option>
          <option value="Guías">Guías</option>
          <option value="Builds">Builds</option>
          <option value="Bugs">Bugs</option>
          <option value="General">General</option>
        </select>

        <span class="field-label">Contenido</span>

        <div class="toolbar" aria-label="Formato del contenido">
          <button type="button" data-command="bold" aria-label="Negrita"><b>N</b></button>
          <button type="button" data-command="italic" aria-label="Cursiva"><i>K</i></button>
          <button type="button" data-command="underline" aria-label="Subrayado"><u>S</u></button>

          <label for="font-size" style="margin:0">Tamaño:</label>
          <select id="font-size" aria-label="Tamaño del texto">
            <option value="">Tamaño</option>
            <option value="2">Pequeño</option>
            <option value="3">Normal</option>
            <option value="4">Grande</option>
            <option value="5">Muy grande</option>
          </select>

          <label for="text-color" style="margin:0">Color:</label>
          <input id="text-color" type="color" value="#202638" aria-label="Elegir color">
          <button id="apply-color" type="button">Aplicar color</button>

          <label for="image-input" class="file-label">Insertar imagen</label>
          <input id="image-input" type="file"
                 accept="image/jpeg,image/png,image/webp,image/gif">
        </div>

        <div class="emoji-list" aria-label="Insertar emoji">
          <button type="button" data-emoji="😀">😀</button>
          <button type="button" data-emoji="😂">😂</button>
          <button type="button" data-emoji="🔥">🔥</button>
          <button type="button" data-emoji="🎮">🎮</button>
          <button type="button" data-emoji="❤️">❤️</button>
          <button type="button" data-emoji="👍">👍</button>
          <button type="button" data-emoji="🏆">🏆</button>
          <button type="button" data-emoji="⚔️">⚔️</button>
        </div>

        <div id="editor" contenteditable="true" role="textbox"
             aria-multiline="true"
             data-placeholder="Escribe aquí el contenido de tu publicación."></div>

        <div class="actions">
          <button id="publish-button" type="submit">Publicar</button>
          <button id="preview-button" type="button">Vista previa</button>
          <button id="draft-button" type="button">Guardar borrador</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="hint">
        Imágenes JPG, PNG, WEBP o GIF de hasta 5 MB.
      </p>
    </section>

    <section id="preview" hidden>
      <div class="preview-card">
        <button id="close-preview" class="close-button" type="button">Cerrar</button>
        <span id="preview-category" class="preview-category"></span>
        <h2 id="preview-title"></h2>
        <div id="preview-content"></div>
      </div>
    </section>
  </main>

  <script>
    // Usa aquí la URL del proyecto y una publishable key.
    // Nunca pongas una service_role key en un archivo del navegador.
    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    const BUCKET = "post-images";
    const LOGIN_PAGE = "login.html";
    const DRAFT_KEY = "mgamers_post_draft";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("post-form");
    const editor = document.getElementById("editor");
    const statusBox = document.getElementById("status");
    const publishButton = document.getElementById("publish-button");
    const authWarning = document.getElementById("auth-warning");
    const loginLink = document.getElementById("login-link");
    const preview = document.getElementById("preview");

    loginLink.href = LOGIN_PAGE;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function getCurrentUser() {
      const { data, error } = await client.auth.getUser();
      if (error) return null;
      return data.user;
    }

    async function updateAuthState() {
      const user = await getCurrentUser();
      authWarning.hidden = Boolean(user);
      publishButton.disabled = !user;
    }

    function insertAtCursor(node) {
      editor.focus();

      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) {
        editor.appendChild(node);
        return;
      }

      const range = selection.getRangeAt(0);
      if (!editor.contains(range.commonAncestorContainer)) {
        editor.appendChild(node);
        return;
      }

      range.deleteContents();
      range.insertNode(node);
      range.setStartAfter(node);
      range.setEndAfter(node);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    document.querySelectorAll("[data-command]").forEach((button) => {
      button.addEventListener("click", () => {
        editor.focus();
        document.execCommand(button.dataset.command, false, null);
      });
    });

    document.getElementById("font-size").addEventListener("change", (event) => {
      if (!event.target.value) return;
      editor.focus();
      document.execCommand("fontSize", false, event.target.value);
      event.target.value = "";
    });

    document.getElementById("apply-color").addEventListener("click", () => {
      editor.focus();
      document.execCommand(
        "foreColor",
        false,
        document.getElementById("text-color").value
      );
    });

    document.querySelectorAll("[data-emoji]").forEach((button) => {
      button.addEventListener("click", () => {
        insertAtCursor(document.createTextNode(button.dataset.emoji));
      });
    });

    document.getElementById("image-input").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
      ];

      if (!allowedTypes.includes(file.type)) {
        setStatus("El formato de imagen no está permitido.");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        setStatus("La imagen supera el límite de 5 MB.");
        return;
      }
      const user = await getCurrentUser();
      if (!user) {
        authWarning.hidden = false;
        setStatus("Inicia sesión para publicar.");
        return;
      }

      const titleInput = document.getElementById("input-title");
      const title = titleInput.value.trim();
      const icon = document.getElementById("post-icon").value;
      const category = document.getElementById("select-tag").value;
      const type = document.getElementById("post-type").value;
      const content = DOMPurify.sanitize(editor.innerHTML, {
        USE_PROFILES: { html: true }
      });

      if (!title) {
        setStatus("Escribe un título.");
        titleInput.focus();
        return;
      }

      if (!category) {
        setStatus("Selecciona una categoría.");
        document.getElementById("select-tag").focus();
        return;
      }

      if (!editor.textContent.trim() && !editor.querySelector("img")) {
        setStatus("Escribe contenido o agrega una imagen.");
        editor.focus();
        return;
      }

      const finalTitle = `${icon ? icon + " " : ""}${title}`;

      publishButton.disabled = true;
      publishButton.textContent = "Publicando…";

      const { error } = await client
        .from("posts")
        .insert({
          titulo: finalTitle,
          contenido: content,
          "categoría": category,
          tipo: type || null
        });

      publishButton.disabled = false;
      publishButton.textContent = "Publicar";

      if (error) {
        setStatus(`No se pudo publicar: ${error.message}`);
        return;
      }

      localStorage.removeItem(DRAFT_KEY);
      form.reset();
      editor.innerHTML = "";
      setStatus("¡Publicación creada correctamente!");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    loadDraft();
    updateAuthState();

    client.auth.onAuthStateChange(() => {
      updateAuthState();
    });
  </script>
</body>
</html>
