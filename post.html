<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva publicación | Foro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
    }

    #side-drawer {
      transform: translateX(-100%);
    }

    #drawer-backdrop {
      opacity: 0;
      pointer-events: none;
    }

    body.drawer-open #side-drawer {
      transform: translateX(0);
    }

    body.drawer-open #drawer-backdrop {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body class="flex min-h-screen flex-col overflow-x-hidden bg-slate-50 text-slate-900">

  <!-- Fondo del menú -->
  <div
    id="drawer-backdrop"
    class="fixed inset-0 z-40 bg-black/50 transition-opacity duration-300"
    onclick="toggleDrawer()"
  ></div>

  <!-- Menú lateral -->
  <aside
    id="side-drawer"
    class="fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col bg-white shadow-2xl transition-transform duration-300"
  >
    <div class="flex items-center justify-between border-b border-slate-200 p-5">
      <h2 class="text-xl font-extrabold text-sky-600">Menú del foro</h2>
      <button
        type="button"
        onclick="toggleDrawer()"
        aria-label="Cerrar menú"
        class="rounded-full p-2 hover:bg-slate-100"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <nav class="flex-1 space-y-2 p-4">
      <a
        href="index.html"
        class="flex items-center gap-3 rounded-xl bg-sky-50 p-4 font-semibold text-sky-700"
      >
        <span class="material-symbols-outlined">home</span>
        Volver al foro
      </a>

      <a
        href="login.html"
        class="flex items-center gap-3 rounded-xl p-4 font-semibold text-slate-600 hover:bg-slate-100"
      >
        <span class="material-symbols-outlined">person</span>
        Iniciar sesión
      </a>
    </nav>
  </aside>

  <!-- Único encabezado; sticky evita que tape el formulario -->
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between px-4">
      <button
        type="button"
        onclick="toggleDrawer()"
        aria-label="Abrir menú"
        class="rounded-full p-2 text-sky-600 hover:bg-slate-100"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>

      <h1 class="text-lg font-extrabold text-sky-600 sm:text-xl">
        Nueva publicación
      </h1>

      <a
        href="index.html"
        aria-label="Volver al foro"
        class="rounded-full p-2 text-slate-600 hover:bg-slate-100"
      >
        <span class="material-symbols-outlined">close</span>
      </a>
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6 sm:py-10">
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
      <div class="mb-6">
        <h2 class="text-2xl font-extrabold">Comparte con la comunidad</h2>
        <p class="mt-2 text-sm text-slate-500">
          Completa los campos y publica tu mensaje en el foro.
        </p>
      </div>

      <div
        id="auth-message"
        class="mb-5 hidden rounded-xl bg-amber-50 p-4 text-sm text-amber-900"
        role="status"
      ></div>

      <form id="post-form" class="space-y-5">
        <div>
          <label for="category" class="mb-2 block text-sm font-bold">
            Comunidad
          </label>
          <select
            id="category"
            name="category"
            required
            class="w-full rounded-xl border-slate-300 bg-white px-4 py-3 focus:border-sky-500 focus:ring-sky-500"
          >
            <option value="">Seleccionar comunidad</option>
            <option value="rakion">Rakion</option>
            <option value="bloody-striker">Bloody Striker</option>
            <option value="general">Comunidad General</option>
          </select>
        </div>

        <div>
          <label for="post-type" class="mb-2 block text-sm font-bold">
            Tipo de publicación
          </label>
          <select
            id="post-type"
            name="tipo"
            required
            class="w-full rounded-xl border-slate-300 bg-white px-4 py-3 focus:border-sky-500 focus:ring-sky-500"
          >
            <option value="General">General</option>
            <option value="Guías">Guías</option>
            <option value="Builds">Builds</option>
            <option value="Bugs">Bugs</option>
          </select>
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between gap-3">
            <label for="title" class="block text-sm font-bold">Título</label>
            <span class="text-xs text-slate-500">
              <span id="title-count">0</span>/150
            </span>
          </div>
          <input
            id="title"
            name="title"
            type="text"
            maxlength="150"
            required
            placeholder="Escribe el título de tu publicación"
            class="w-full rounded-xl border-slate-300 px-4 py-3 focus:border-sky-500 focus:ring-sky-500"
          >
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between gap-3">
            <label for="content" class="block text-sm font-bold">Contenido</label>
            <span id="content-count" class="text-xs text-slate-500">0/280</span>
          </div>
          <textarea
            id="content"
            name="content"
            rows="8"
            maxlength="280"
            required
            placeholder="¡Comparte algo con la comunidad!"
            class="min-h-[220px] w-full resize-y rounded-xl border-slate-300 px-4 py-3 leading-7 focus:border-sky-500 focus:ring-sky-500"
          ></textarea>
          <p class="mt-1 text-xs text-slate-500">Máximo 280 caracteres.</p>
        </div>

        <p
          id="status"
          role="status"
          aria-live="polite"
          class="hidden rounded-xl p-4 text-sm"
        ></p>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-5 sm:flex-row sm:justify-end">
          <a
            href="index.html"
            class="rounded-xl border border-slate-300 px-5 py-3 text-center font-bold text-slate-700 hover:bg-slate-50"
          >
            Cancelar
          </a>

          <button
            id="publish-button"
            type="submit"
            disabled
            class="rounded-xl bg-sky-500 px-6 py-3 font-bold text-white hover:bg-sky-600 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Publicar
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("post-form");
    const publishButton = document.getElementById("publish-button");
    const authMessage = document.getElementById("auth-message");
    const statusElement = document.getElementById("status");
    const titleInput = document.getElementById("title");
    const contentInput = document.getElementById("content");

    let currentUser = null;

    function toggleDrawer() {
      document.body.classList.toggle("drawer-open");
      document.body.classList.toggle("overflow-hidden");
    }

    function showStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = "rounded-xl p-4 text-sm";

      if (type === "success") {
        statusElement.classList.add("bg-green-50", "text-green-800");
      } else {
        statusElement.classList.add("bg-red-50", "text-red-800");
      }
    }

    function updateAuthUI() {
      const isConfigured = SUPABASE_PUBLISHABLE_KEY !== "TU_PUBLISHABLE_KEY";

      if (!isConfigured) {
        authMessage.textContent =
          "Configura la publishable key de Supabase en este archivo para activar la publicación.";
        authMessage.classList.remove("hidden");
        publishButton.disabled = true;
        return;
      }

      if (!currentUser) {
        authMessage.innerHTML = "";
        authMessage.append("Debes iniciar sesión para publicar. ");

        const loginLink = document.createElement("a");
        loginLink.href = "login.html";
        loginLink.textContent = "Iniciar sesión";
        loginLink.className = "font-bold underline";
        authMessage.appendChild(loginLink);

        authMessage.classList.remove("hidden");
        publishButton.disabled = true;
        return;
      }

      authMessage.classList.add("hidden");
      publishButton.disabled = false;
    }

    function updateCounters() {
      document.getElementById("title-count").textContent =
        titleInput.value.length;

      document.getElementById("content-count").textContent =
        `${contentInput.value.length}/280`;
    }

    titleInput.addEventListener("input", updateCounters);
    contentInput.addEventListener("input", updateCounters);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusElement.classList.add("hidden");

      if (!currentUser) {
        showStatus("Inicia sesión antes de publicar.", "error");
        return;
      }

      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const category = document.getElementById("category").value;
      const type = document.getElementById("post-type").value;

      if (!title || !content || !category || !type) {
        showStatus(
          "Completa el título, contenido, comunidad y tipo de publicación.",
          "error"
        );
        return;
      }

      publishButton.disabled = true;
      publishButton.textContent = "Publicando…";

      const { error } = await supabaseClient
        .from("posts")
        .insert({
          titulo: title,
          contenido: content,
          "categoría": category,
          tipo: type,
          author_id: currentUser.id
        });

      publishButton.textContent = "Publicar";
      publishButton.disabled = false;

      if (error) {
        showStatus(`No se pudo publicar: ${error.message}`, "error");
        return;
      }

      showStatus("¡Publicación creada!", "success");

      const forumLink = document.createElement("a");
      forumLink.href = "index.html";
      forumLink.textContent = " Ir al foro";
      forumLink.className = "ml-1 font-bold underline";
      statusElement.appendChild(forumLink);

      form.reset();
      updateCounters();
    });

    async function init() {
      if (SUPABASE_PUBLISHABLE_KEY === "TU_PUBLISHABLE_KEY") {
        updateAuthUI();
        return;
      }

      const { data, error } = await supabaseClient.auth.getSession();
      currentUser = error ? null : data.session?.user ?? null;
      updateAuthUI();

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        currentUser = session?.user ?? null;
        updateAuthUI();
      });
    }

    updateCounters();
    init();
  </script>
</body>
</html>
