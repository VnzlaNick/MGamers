<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear publicación</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      background: #f4f6fa;
      color: #202638;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 780px);
      margin: 0 auto;
    }

    .card {
      padding: clamp(18px, 4vw, 32px);
      border: 1px solid #e1e5ed;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 28px rgb(20 30 60 / 8%);
    }

    h1 { margin-top: 0; }

    label, .field-label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd1dc;
      border-radius: 8px;
      background: #fff;
      color: #202638;
      font: inherit;
    }

    .toolbar, .actions, .emojis {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .toolbar { margin: 10px 0; }

    button, .file-label {
      padding: 9px 12px;
      border: 1px solid #cbd1dc;
      border-radius: 8px;
      background: #f5f6fa;
      color: #202638;
      font: inherit;
      cursor: pointer;
    }

    button:hover, .file-label:hover { background: #e9ecf4; }

    #image-input { display: none; }

    #editor {
      min-height: 260px;
      padding: 14px;
      border: 1px solid #cbd1dc;
      border-radius: 10px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #editor:focus {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }

    #editor:empty::before {
      content: attr(data-placeholder);
      color: #858c9b;
    }

    #editor img, #preview-content img {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: 500px;
      margin: 12px 0;
      border-radius: 10px;
    }

    .emojis { margin: 8px 0; }

    .emojis button {
      min-width: 40px;
      font-size: 20px;
    }

    .actions { margin-top: 20px; }

    #publish-button {
      border-color: #4f46e5;
      background: #4f46e5;
      color: white;
      font-weight: 700;
    }

    #status {
      min-height: 24px;
      overflow-wrap: anywhere;
    }

    #auth-warning {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fff2cf;
    }

    #preview {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgb(0 0 0 / 58%);
      overflow-y: auto;
    }

    #preview[hidden] { display: none; }

    .preview-card {
      width: min(100%, 780px);
      max-height: calc(100dvh - 32px);
      padding: clamp(18px, 4vw, 32px);
      border-radius: 16px;
      background: white;
      overflow-y: auto;
      overflow-wrap: anywhere;
    }

    .preview-meta {
      color: #667085;
      font-size: 14px;
    }

    #preview-content { line-height: 1.6; }

    #close-preview { float: right; }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <main>
    <p><a href="index.html">← Volver al inicio</a></p>

    <div id="auth-warning" hidden>
      Inicia sesión para crear una publicacióon.
      <a id="login-link" href="login.html">Ir a iniciar sesión</a>
    </div>

    <section class="card">
      <h1>Crear publicación</h1>
      <p>Completa los campos y pulsa Publicar.</p>

      <form id="post-form">
        <label for="post-icon">Icono</label>
        <select id="post-icon">
          <option value="">Sin icono</option>
          <option value="🎮">🎮 Videojuegos</option>
          <option value="📢">📢 Anuncio</option>
          <option value="🏆">🏆 Torneo</option>
          <option value="💡">💡 Consejo</option>
          <option value="🛠️">🛠️ Hardware</option>
          <option value="❓">❓ Pregunta</option>
        </select>

        <label for="post-title">Título</label>
        <input id="post-title" type="text" maxlength="150"
               placeholder="Escribe el título" required>

        <label for="post-category">Categoría</label>
        <select id="post-category" required>
          <option value="">Selecciona una categoría</option>
          <option value="feed-noticias">Noticias</option>
          <option value="feed-mu">Servidores Mu</option>
          <option value="feed-Blood">Blood Strike</option>
          <option value="feed-Free">Free Fire</option>
          <option value="feed-mobiles">Mobile Legends</option>
          <option value="feed-brawl">Brawl Star</option>
          <option value="feed-Gounbound">Gounbound</option>
          <option value="Feed-pokemon">Zona Pokémon</option>
          <option value="feed-minicraft">Minecraft</option>
          <option value="feed-dino">Zona Dino</option>
          <option value="feed-sim">Zona Simuladores</option>
          <option value="feed-libre">Zona Libre</option>
          <option value="feed-guia">Zona Guía</option>
        </select>

        <label for="post-type">Tipo (opcional)</label>
        <select id="post-type">
          <option value="">Sin tipo</option>
          <option value="Guías">Guías</option>
          <option value="Builds">Builds</option>
          <option value="Bugs">Bugs</option>
          <option value="General">General</option>
        </select>

        <span class="field-label">Contenido</span>

        <div class="toolbar">
          <button type="button" data-format="bold"><b>Negrita</b></button>
          <button type="button" data-format="italic"><i>Cursiva</i></button>
          <button type="button" data-format="underline"><u>Subrayado</u></button>

          <label for="font-size" style="margin:0">Tamaño</label>
          <select id="font-size" style="width:auto">
            <option value="">Normal</option>
            <option value="2">Pequeño</option>
            <option value="4">Grande</option>
            <option value="5">Muy grande</option>
          </select>

          <label for="font-color" style="margin:0">Color</label>
          <input id="font-color" type="color" value="#202638"
                 style="width:45px;height:40px;padding:3px">

          <button id="color-button" type="button">Aplicar color</button>

          <label for="image-input" class="file-label">Subir imagen</label>
          <input id="image-input" type="file"
                 accept="image/jpeg,image/png,image/webp,image/gif">
        </div>

        <div class="emojis">
          <button type="button" data-emoji="😀">😀</button>
          <button type="button" data-emoji="😂">😂</button>
          <button type="button" data-emoji="🔥">🔥</button>
          <button type="button" data-emoji="🎮">🎮</button>
          <button type="button" data-emoji="❤️">❤️</button>
          <button type="button" data-emoji="👍">👍</button>
          <button type="button" data-emoji="🏆">🏆</button>
        </div>

        <div id="editor" contenteditable="true"
             data-placeholder="Escribe aquí el contenido de la publicación…"></div>

        <div class="actions">
          <button id="publish-button" type="submit">Publicar</button>
          <button id="preview-button" type="button">Vista previa</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="preview" hidden>
      <article class="preview-card">
        <button id="close-preview" type="button">Cerrar</button>
        <p id="preview-meta" class="preview-meta"></p>
        <h2 id="preview-title"></h2>
        <div id="preview-content"></div>
      </article>
    </section>
  </main>

  <script>
    // Tu URL del proyecto y publishable key.
    // No coloques aquí una service_role key.
    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    const BUCKET_NAME = "post-images";
    const LOGIN_URL = "login.html";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const editor = document.getElementById("editor");
    const form = document.getElementById("post-form");
    const status = document.getElementById("status");
    const publishButton = document.getElementById("publish-button");
    const authWarning = document.getElementById("auth-warning");
    const preview = document.getElementById("preview");

    document.getElementById("login-link").href = LOGIN_URL;

    function showStatus(message) {
      status.textContent = message;
    }

    async function getUser() {
      const { data, error } = await supabaseClient.auth.getUser();
      if (error) return null;
      return data.user;
    }

    async function checkLogin() {
      const user = await getUser();
      authWarning.hidden = Boolean(user);
      publishButton.disabled = !user;
    }

    function insertAtCursor(element) {
      editor.focus();

      const selection = window.getSelection();

      if (!selection || selection.rangeCount === 0) {
        editor.appendChild(element);
        return;
      }

      const range = selection.getRangeAt(0);

      if (!editor.contains(range.commonAncestorContainer)) {
        editor.appendChild(element);
        return;
      }

      range.deleteContents();
      range.insertNode(element);
      range.setStartAfter(element);
      range.setEndAfter(element);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    document.querySelectorAll("[data-format]").forEach((button) => {
      button.addEventListener("click", () => {
        editor.focus();
        document.execCommand(button.dataset.format, false, null);
      });
    });

    document.getElementById("color-button").addEventListener("click", () => {
      editor.focus();
      document.execCommand(
        "foreColor",
        false,
        document.getElementById("font-color").value
      );
    });

    document.getElementById("font-size").addEventListener("change", (event) => {
      if (!event.target.value) return;
      editor.focus();
      document.execCommand("fontSize", false, event.target.value);
      event.target.value = "";
    });

    document.querySelectorAll("[data-emoji]").forEach((button) => {
      button.addEventListener("click", () => {
        insertAtCursor(document.createTextNode(button.dataset.emoji));
      });
    });

    document.getElementById("image-input").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";

      if (!file) return;

      const extensions = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };

      if (!extensions[file.type]) {
        showStatus("Elige una imagen JPG, PNG, WEBP o GIF.");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        showStatus("La imagen no puede superar 5 MB.");
        return;
      }

      const user = await getUser();

      if (!user) {
        authWarning.hidden = false;
        showStatus("Inicia sesión antes de subir imágenes.");
        return;
      }

      const path = `${user.id}/${crypto.randomUUID()}.${extensions[file.type]}`;
      showStatus("Subiendo imagen…");

      const { error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(path, file, {
          contentType: file.type,
          upsert: false
        });

      if (error) {
        showStatus(`Error al subir la imagen: ${error.message}`);
        return;
      }

      const { data } = supabaseClient.storage
        .from(BUCKET_NAME)
        .getPublicUrl(path);

      const image = document.createElement("img");
      image.src = data.publicUrl;
      image.alt = "Imagen de la publicación";
      image.loading = "lazy";

      insertAtCursor(image);
      showStatus("Imagen agregada.");
    });

    document.getElementById("preview-button").addEventListener("click", () => {
      const icon = document.getElementById("post-icon").value;
      const title = document.getElementById("post-title").value.trim();
      const categorySelect = document.getElementById("post-category");
      const categoryText =
        categorySelect.options[categorySelect.selectedIndex]?.text || "";

      document.getElementById("preview-title").textContent =
        `${icon ? icon + " " : ""}${title || "Título de la publicación"}`;

      document.getElementById("preview-meta").textContent = categoryText;
      document.getElementById("preview-content").innerHTML =
        DOMPurify.sanitize(editor.innerHTML, {
          USE_PROFILES: { html: true }
        }) || "<p>El contenido aparecerá aquí.</p>";

      preview.hidden = false;
    });

    function closePreview() {
      preview.hidden = true;
    }

    document.getElementById("close-preview")
      .addEventListener("click", closePreview);

    preview.addEventListener("click", (event) => {
      if (event.target === preview) closePreview();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePreview();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showStatus("");

      const user = await getUser();

      if (!user) {
        authWarning.hidden = false;
        showStatus("Inicia sesión para publicar.");
        return;
      }

      const title = document.getElementById("post-title").value.trim();
      const icon = document.getElementById("post-icon").value;
      const category = document.getElementById("post-category").value;
      const type = document.getElementById("post-type").value;
      const content = DOMPurify.sanitize(editor.innerHTML, {
        USE_PROFILES: { html: true }
      });

      if (!title) {
        showStatus("Escribe un título.");
        return;
      }

      if (!category) {
        showStatus("Selecciona una categoría.");
        return;
      }

      if (!editor.textContent.trim() && !editor.querySelector("img")) {
        showStatus("Escribe contenido o agrega una imagen.");
        return;
      }

      publishButton.disabled = true;
      publishButton.textContent = "Publicando…";

      const { error } = await supabaseClient
        .from("posts")
        .insert({
          titulo: `${icon ? icon + " " : ""}${title}`,
          contenido: content,
          "categoría": category,
          tipo: type || null
        });

      publishButton.disabled = false;
      publishButton.textContent = "Publicar";

      if (error) {
        showStatus(`No se pudo publicar: ${error.message}`);
        return;
      }

      form.reset();
      editor.innerHTML = "";
      showStatus("¡Publicación creada correctamente!");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    checkLogin();

    supabaseClient.auth.onAuthStateChange(() => {
      checkLogin();
    });
  </script>
</body>
</html>
