<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zona de descargas | MGamers</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
    .material-symbols-outlined { vertical-align: middle; }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-10 border-b bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-xl font-extrabold text-sky-600">MGamers</a>
      <div class="flex items-center gap-3">
        <span id="session-label" class="text-sm text-slate-500">Cargando…</span>
        <button id="signout-button" class="hidden rounded-lg border px-3 py-2 text-sm hover:bg-slate-50">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-8 px-4 py-8">
    <section class="rounded-2xl bg-gradient-to-r from-sky-600 to-blue-800 p-6 text-white md:p-10">
      <p class="mb-2 text-sm font-bold uppercase tracking-widest text-sky-100">Movil Gamers</p>
      <h1 class="text-3xl font-extrabold md:text-4xl">Zona de descargas</h1>
      <p class="mt-3 max-w-2xl text-sky-50">
        Explora los juegos disponibles y descarga desde sus enlaces de MediaFire.
      </p>
    </section>

    <section class="flex flex-col gap-3 sm:flex-row">
      <label for="search-input" class="sr-only">Buscar juegos</label>
      <div class="flex flex-1 items-center gap-2 rounded-xl border bg-white px-4">
        <span class="material-symbols-outlined text-slate-400">search</span>
        <input
          id="search-input"
          type="search"
          placeholder="Buscar por nombre, descripción o versión…"
          class="w-full border-0 py-3 focus:ring-0"
        >
      </div>
      <p id="game-count" class="self-center text-sm text-slate-500"></p>
    </section>

    <section id="admin-panel" hidden class="rounded-2xl border border-sky-200 bg-white p-5 shadow-sm">
      <h2 class="text-xl font-bold">Publicar un juego</h2>
      <p class="mt-1 text-sm text-slate-500">
        Este formulario solo aparece para administradores autenticados.
      </p>

      <form id="game-form" class="mt-5 grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="text-sm font-semibold">Nombre del juego *</span>
          <input name="titulo" required maxlength="150"
            class="mt-1 w-full rounded-lg border-slate-300" placeholder="Nombre">
        </label>

        <label class="block">
          <span class="text-sm font-semibold">Versión</span>
          <input name="version" maxlength="50"
            class="mt-1 w-full rounded-lg border-slate-300" placeholder="Ej. 1.2.0">
        </label>

        <label class="block md:col-span-2">
          <span class="text-sm font-semibold">Descripción</span>
          <textarea name="descripcion" rows="3"
            class="mt-1 w-full rounded-lg border-slate-300" placeholder="Descripción del juego"></textarea>
        </label>

        <label class="block">
          <span class="text-sm font-semibold">URL de la imagen</span>
          <input name="imagen_url" type="url"
            class="mt-1 w-full rounded-lg border-slate-300" placeholder="https://…">
        </label>

        <label class="block">
          <span class="text-sm font-semibold">Enlace de MediaFire *</span>
          <input name="mediafire_url" type="url" required
            class="mt-1 w-full rounded-lg border-slate-300" placeholder="https://www.mediafire.com/…">
        </label>

        <div class="flex items-center gap-3 md:col-span-2">
          <button type="submit"
            class="rounded-lg bg-sky-600 px-5 py-3 font-bold text-white hover:bg-sky-700">
            Publicar juego
          </button>
          <p id="form-message" class="text-sm" role="status"></p>
        </div>
      </form>
    </section>

    <section>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-2xl font-extrabold">Juegos disponibles</h2>
      </div>

      <p id="load-message" class="rounded-xl bg-white p-5 text-slate-600" role="status">
        Cargando juegos…
      </p>
      <div id="game-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    const grid = document.querySelector("#game-grid");
    const loadMessage = document.querySelector("#load-message");
    const searchInput = document.querySelector("#search-input");
    const gameCount = document.querySelector("#game-count");
    const adminPanel = document.querySelector("#admin-panel");
    const sessionLabel = document.querySelector("#session-label");
    const signoutButton = document.querySelector("#signout-button");
    const gameForm = document.querySelector("#game-form");
    const formMessage = document.querySelector("#form-message");

    let games = [];

    if (SUPABASE_PUBLISHABLE_KEY === "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp") {
      loadMessage.textContent =
        "Falta configurar la publishable key de Supabase en este archivo.";
      throw new Error("Configura SUPABASE_PUBLISHABLE_KEY.");
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function safeHttpsUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function makeGameCard(game) {
      const card = document.createElement("article");
      card.className = "overflow-hidden rounded-2xl border bg-white shadow-sm";

      const imageUrl = safeHttpsUrl(game.imagen_url);
      if (imageUrl) {
        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = game.titulo;
        image.loading = "lazy";
        image.className = "h-48 w-full bg-slate-100 object-cover";
        card.append(image);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className =
          "flex h-48 items-center justify-center bg-sky-50 text-sky-600";
        placeholder.innerHTML =
          '<span class="material-symbols-outlined text-6xl">sports_esports</span>';
        card.append(placeholder);
      }

      const content = document.createElement("div");
      content.className = "space-y-3 p-4";

      const title = document.createElement("h3");
      title.className = "truncate text-lg font-bold";
      title.textContent = game.titulo || "Juego sin título";
      content.append(title);

      if (game.version) {
        const version = document.createElement("p");
        version.className = "text-sm text-slate-500";
        version.textContent = `Versión: ${game.version}`;
        content.append(version);
      }

      if (game.descripcion) {
        const description = document.createElement("p");
        description.className = "line-clamp-3 text-sm text-slate-600";
        description.textContent = game.descripcion;
        content.append(description);
      }

      const downloadUrl = safeHttpsUrl(game.mediafire_url);
      if (downloadUrl) {
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className =
          "inline-flex w-full items-center justify-center gap-2 rounded-lg bg-sky-600 px-4 py-3 font-bold text-white hover:bg-sky-700";
        link.innerHTML =
          '<span class="material-symbols-outlined">download</span> Descargar en MediaFire';
        content.append(link);
      }

      card.append(content);
      return card;
    }

    function renderGames() {
      const term = searchInput.value.trim().toLocaleLowerCase("es");
      const filtered = games.filter((game) => {
        const text = [
          game.titulo,
          game.descripcion,
          game.version
        ].filter(Boolean).join(" ").toLocaleLowerCase("es");
        return text.includes(term);
      });

      grid.replaceChildren(...filtered.map(makeGameCard));
      gameCount.textContent =
        `${filtered.length} ${filtered.length === 1 ? "juego" : "juegos"}`;

      loadMessage.hidden = filtered.length > 0;
      if (filtered.length === 0) {
        loadMessage.textContent = games.length
          ? "No hay juegos que coincidan con la búsqueda."
          : "Todavía no hay juegos publicados.";
      }
    }

    async function loadGames() {
      loadMessage.hidden = false;
      loadMessage.textContent = "Cargando juegos…";

      const { data, error } = await supabase
        .from("juegos_descarga")
        .select("id, titulo, descripcion, version, imagen_url, mediafire_url, creado_en")
        .eq("activo", true)
        .order("creado_en", { ascending: false })
        .limit(100);

      if (error) {
        console.error("Error al cargar juegos:", error.message);
        loadMessage.textContent =
          "No se pudieron cargar los juegos. Revisa la conexión y el acceso a la tabla.";
        return;
      }

      games = data ?? [];
      renderGames();
    }

    function updateAdminView(session) {
      const user = session?.user;
      const isAdmin = user?.app_metadata?.role === "admin";

      adminPanel.hidden = !isAdmin;
      signoutButton.classList.toggle("hidden", !session);
      sessionLabel.textContent = isAdmin
        ? "Sesión de administrador"
        : session
          ? "Sesión iniciada"
          : "Vista pública";
    }

    searchInput.addEventListener("input", renderGames);

    gameForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      formMessage.textContent = "Publicando…";

      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session?.user?.app_metadata?.role !== "admin") {
        formMessage.textContent = "Inicia sesión con una cuenta administradora.";
        return;
      }

      const formData = new FormData(gameForm);
      const newGame = {
        titulo: String(formData.get("titulo") ?? "").trim(),
        descripcion: String(formData.get("descripcion") ?? "").trim() || null,
        version: String(formData.get("version") ?? "").trim() || null,
        imagen_url: String(formData.get("imagen_url") ?? "").trim() || null,
        mediafire_url: String(formData.get("mediafire_url") ?? "").trim(),
        activo: true
      };

      const { error } = await supabase
        .from("juegos_descarga")
        .insert(newGame);

      if (error) {
        console.error("Error al publicar:", error.message);
        formMessage.textContent =
          "No se pudo publicar. Comprueba el enlace y tus permisos de administrador.";
        return;
      }

      gameForm.reset();
      formMessage.textContent = "Juego publicado correctamente.";
      await loadGames();
    });

    signoutButton.addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        sessionLabel.textContent = "No se pudo cerrar la sesión.";
        return;
      }
      updateAdminView(null);
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      updateAdminView(session);
    });

    const { data: sessionData } = await supabase.auth.getSession();
    updateAdminView(sessionData.session);
    await loadGames();
  </script>
</body>
</html>
