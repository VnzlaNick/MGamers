<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | MGamers</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eef2ff;
      background: #10131c;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid #30364a;
      border-radius: 16px;
      background: #191e2b;
      box-shadow: 0 18px 55px #0006;
    }

    h1 { margin: 0 0 8px; }
    p { color: #b8c0d4; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 9px;
      font: inherit;
    }

    input {
      color: #fff;
      background: #10131c;
      border: 1px solid #414961;
    }

    button {
      margin-top: 22px;
      border: 0;
      color: #fff;
      background: #6558e8;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .65; cursor: wait; }

    #mensaje {
      min-height: 24px;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .nota { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>MGamers</h1>
    <p>Inicia sesión para entrar al foro.</p>

    <form id="formulario">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button id="boton" type="submit">Iniciar sesión</button>
    </form>

    <p id="mensaje" role="status" aria-live="polite"></p>
    <p class="nota">Usa el correo asociado a tu cuenta del foro.</p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    // URL del proyecto Supabase
    const SUPABASE_URL =
      "https://zrrpjbqduwtaxsfbsuum.supabase.co";

    // Sustituye esto por la publishable key o la clave anon
    // de tu proyecto. Nunca pongas aquí una service_role key.
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    // Cambia esto por la dirección real de la página del foro.
    // Ejemplo: "./foro.html" o "https://tu-dominio.com/foro"
    const FORUM_URL = "https://vnzlanick.github.io/MGamers/";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.querySelector("#formulario");
    const button = document.querySelector("#boton");
    const message = document.querySelector("#mensaje");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      button.disabled = true;
      button.textContent = "Ingresando…";

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent =
          "No se pudo iniciar sesión. Revisa el correo y la contraseña.";
        button.disabled = false;
        button.textContent = "Iniciar sesión";
        return;
      }

      message.textContent = "Sesión iniciada. Abriendo el foro…";
      window.location.assign(FORUM_URL);
    });
  </script>
</body>
</html>
