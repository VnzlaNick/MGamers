<!doctype html>
<html class="light" lang="es">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subcategoría | Modelo Base</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "outline-variant": "#bec7d3",
            "on-secondary-container": "#566475",
            "outline": "#6f7882",
            "background": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "primary": "#1da1f2",
            "primary-container": "#1da1f2",
            "on-primary": "#ffffff",
            "on-surface": "#191c1e",
            "on-surface-variant": "#3f4851",
            "secondary-container": "#d3e1f6",
            "error": "#ba1a1a"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "container-margin": "1rem"
          },
          fontFamily: {
            "body-md": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"],
            "display-lg": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "label-bold": ["Plus Jakarta Sans"],
            "title-sm": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "label-bold": ["11px", { lineHeight: "16px", fontWeight: "700" }],
            "body-md": ["14px", { lineHeight: "22px" }],
            "body-sm": ["12px", { lineHeight: "18px" }],
            "display-lg": ["24px", { lineHeight: "32px", fontWeight: "800" }],
            "headline-md": ["18px", { lineHeight: "24px", fontWeight: "700" }],
            "title-sm": ["14px", { lineHeight: "20px", fontWeight: "700" }]
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .drawer-open #side-drawer {
      transform: translateX(0);
    }

    .drawer-open #drawer-backdrop {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
 </head>

   <nav class="flex-1 space-y-2 overflow-y-auto p-4" aria-label="Menú principal">
    <a class="flex items-center gap-4 rounded-xl bg-primary/10 p-4 font-title-sm text-primary" href="index.html">

    <a class="flex items-center gap-4 rounded-xl p-4 font-title-sm text-on-surface-variant transition-colors hover:bg-surface-container-low" href="#">
     <span class="material-symbols-outlined">sports_esports</span> Torneos
    </a>
    <a class="flex items-center gap-4 rounded-xl p-4 font-title-sm text-on-surface-variant transition-colors hover:bg-surface-container-low" href="#">
     <span class="material-symbols-outlined">groups</span> Comunidad
    </a>
    <a class="flex items-center gap-4 rounded-xl p-4 font-title-sm text-on-surface-variant transition-colors hover:bg-surface-container-low" href="#">
     <span class="material-symbols-outlined">leaderboard</span> Ranking
    </a>
    <a class="flex items-center gap-4 rounded-xl p-4 font-title-sm text-on-surface-variant transition-colors hover:bg-surface-container-low" href="#">
     <span class="material-symbols-outlined">person</span> Mi Perfil
    </a>
   </nav>

   <div class="border-t border-outline-variant p-4">
    <button type="button" class="flex w-full items-center justify-center gap-2 rounded-lg p-3 font-title-sm text-error transition-colors hover:bg-red-50" onclick="toggleDrawer()">
     <span class="material-symbols-outlined">logout</span> Cerrar
    </button>

  <header class="fixed top-0 z-50 w-full border-b border-outline-variant bg-white">
   <div class="mx-auto flex h-16 w-full max-w-screen-xl items-center justify-between px-container-margin">
    <button type="button" class="rounded-full p-2 transition-transform hover:bg-surface-container-low active:scale-95" aria-label="Abrir menú" onclick="toggleDrawer()">
     <span class="material-symbols-outlined text-primary">menu</span>
    </button>
    <h1 class="font-display-lg text-display-lg tracking-tighter text-primary">Movil Gamers</h1>
    <span class="w-10" aria-hidden="true"></span>
   </div>
  </header>

  <main class="mx-auto max-w-md px-6 pt-20">
   <section class="mb-6">
    <div class="relative mb-4 h-40 overflow-hidden rounded-xl">
     <img id="subcategory-image" class="h-full w-full object-cover" src="https://img.wpfc.ml/24h/apm9c6.jpg" alt="Imagen de la subcategoría">
     <div class="absolute inset-0 flex items-end bg-gradient-to-t from-black/60 to-transparent p-4">
      <div>
       <h2 id="subcategory-title" class="font-headline-md text-headline-md text-white">Servidores Mu</h2>
       <p id="subcategory-description" class="font-body-sm text-body-sm text-white/80">Comunidad Oficial de Jugadores</p>
      </div>
     </div>
    </div>

    <div class="space-y-4">
     <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
      <input id="post-search" class="w-full rounded-xl border border-outline-variant bg-white py-3 pl-10 pr-4 font-body-md text-body-md outline-none focus:border-transparent focus:ring-2 focus:ring-primary" placeholder="Buscar publicaciones..." type="search">
     </div>

     <div id="type-filters" class="hide-scrollbar flex gap-2 overflow-x-auto pb-2">
      <button type="button" data-type="" class="filter-button whitespace-nowrap rounded-full bg-primary px-4 py-1.5 font-label-bold text-label-bold text-white">Todo</button>
      <button type="button" data-type="Guías" class="filter-button whitespace-nowrap rounded-full border border-outline-variant bg-white px-4 py-1.5 font-label-bold text-label-bold text-on-surface-variant">Guías</button>
      <button type="button" data-type="Builds" class="filter-button whitespace-nowrap rounded-full border border-outline-variant bg-white px-4 py-1.5 font-label-bold text-label-bold text-on-surface-variant">Builds</button>
      <button type="button" data-type="Bugs" class="filter-button whitespace-nowrap rounded-full border border-outline-variant bg-white px-4 py-1.5 font-label-bold text-label-bold text-on-surface-variant">Bugs</button>
      <button type="button" data-type="General" class="filter-button whitespace-nowrap rounded-full border border-outline-variant bg-white px-4 py-1.5 font-label-bold text-label-bold text-on-surface-variant">General</button>
     </div>
    </div>
   </section>

   <p id="post-status" class="py-3 text-center font-body-sm text-body-sm text-on-surface-variant" aria-live="polite">Cargando publicaciones…</p>
   <div id="post-list" class="space-y-4"></div>
  </main>

  <nav class="fixed bottom-0 left-4 right-4 z-[80] flex items-center justify-between border-t border-outline-variant bg-white/95 px-2 pb-2 pt-1 backdrop-blur-md" aria-label="Navegación inferior">
   <a href="index.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined text-[24px]">home</span>
    <span class="text-[10px] font-bold">Inicio</span>
   </a>
   <a href="bdona.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined text-[24px]">volunteer_activism</span>
    <span class="text-[10px] font-bold">Donar</span>
   </a>
   <a href="post.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined text-[24px]">edit_square</span>
    <span class="text-[10px] font-bold">Nuevo</span>
   </a>
   <a href="mant.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined text-[24px]">notifications</span>
    <span class="text-[10px] font-bold">Nota</span>
   </a>
   <a href="inres.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined text-[24px]">person</span>
    <span class="text-[10px] font-bold">Ingreso</span>
   </a>
  </nav>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://zrrpjbqduwtaxsfbsuum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7sOPZc2sJT4jExW3gAREgA_GBpRe6Rp";

    const DEFAULT_IMAGE = "https://img.wpfc.ml/24h/apm9c6.jpg";
    const DEFAULT_DESCRIPTION = "Comunidad Oficial de Jugadores";

    const params = new URLSearchParams(window.location.search);
    const category = (params.get("categoria") || "").trim();
    const categoryName = (params.get("nombre") || category || "Servidores Mu").trim();
    const categoryDescription = (params.get("descripcion") || DEFAULT_DESCRIPTION).trim();
    const categoryImage = params.get("imagen");

    const titleElement = document.getElementById("subcategory-title");
    const descriptionElement = document.getElementById("subcategory-description");
    const imageElement = document.getElementById("subcategory-image");
    const searchInput = document.getElementById("post-search");
    const postList = document.getElementById("post-list");
    const statusElement = document.getElementById("post-status");
    const filterButtons = document.querySelectorAll(".filter-button");

    let selectedType = "";
    let allPosts = [];
    let supabase = null;
    let requestVersion = 0;
    let currentUserId = null;
    let currentUserIsAdmin = false;
    let authChecked = false;

    titleElement.textContent = categoryName;
    descriptionElement.textContent = categoryDescription;
    document.title = `${categoryName} | Modelo Base`;
    searchInput.placeholder = `Buscar en ${categoryName}...`;
    imageElement.alt = categoryName;

    if (categoryImage) {
      try {
        const parsedImageUrl = new URL(categoryImage);
        if (parsedImageUrl.protocol === "https:") {
          imageElement.src = parsedImageUrl.href;
        }
      } catch {
        imageElement.src = DEFAULT_IMAGE;
      }
    }

    imageElement.addEventListener("error", () => {
      if (!imageElement.src.endsWith(DEFAULT_IMAGE)) {
        imageElement.src = DEFAULT_IMAGE;
      }
    });

    function setStatus(message) {
      statusElement.textContent = message;
      statusElement.classList.toggle("hidden", !message);
    }

    function timeAgo(dateValue) {
      if (!dateValue) return "";

      const date = new Date(dateValue);
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

      if (!Number.isFinite(seconds)) return "";
      if (seconds < 60) return "Ahora";
      if (seconds < 3600) return `Hace ${Math.floor(seconds / 60)} min`;
      if (seconds < 86400) return `Hace ${Math.floor(seconds / 3600)} horas`;
      if (seconds < 604800) return `Hace ${Math.floor(seconds / 86400)} días`;

      return date.toLocaleDateString("es");
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function getInitial(name) {
      return Array.from((name || "Jugador").trim())[0]?.toLocaleUpperCase("es") || "J";
    }

    function renderAvatar(avatarFrame, profile, authorName) {
      const avatarUrl = profile?.avatar_url?.trim();

      if (!avatarUrl) {
        avatarFrame.appendChild(
          makeElement("span", "text-sm font-bold text-white", getInitial(authorName))
        );
        return;
      }

      const avatarImage = makeElement("img", "h-full w-full object-cover");
      avatarImage.src = avatarUrl;
      avatarImage.alt = `Foto de perfil de ${authorName}`;
      avatarImage.loading = "lazy";

      avatarImage.addEventListener("error", () => {
        avatarFrame.replaceChildren(
          makeElement("span", "text-sm font-bold text-white", getInitial(authorName))
        );
      }, { once: true });

      avatarFrame.appendChild(avatarImage);
    }

    function canManagePost(post) {
      return Boolean(
        currentUserId &&
        (post.author_id === currentUserId || currentUserIsAdmin)
      );
    }

    async function togglePinned(post) {
      if (!currentUserIsAdmin) {
        window.alert("Solo un administrador puede fijar publicaciones.");
        return;
      }

      const nextPinnedState = !post.fijado;

      const { data, error } = await supabase
        .from("posts")
        .update({ fijado: nextPinnedState })
        .eq("id", post.id)
        .select("id, fijado");

      if (error) {
        console.error("Error cambiando el estado fijado:", error);
        window.alert("No se pudo cambiar el estado de la publicación.");
        return;
      }

      if (!data || data.length === 0) {
        window.alert("No se modificó la publicación. Revisa tus permisos.");
        return;
      }

      await loadPosts();
    }

    async function editPost(post) {
      const title = window.prompt("Editar título:", post.titulo || "");
      if (title === null) return;

      const content = window.prompt("Editar contenido:", post.contenido || "");
      if (content === null) return;

      const type = window.prompt(
        "Tipo: Guías, Builds, Bugs o General",
        post.tipo || "General"
      );
      if (type === null) return;

      const validTypes = ["Guías", "Builds", "Bugs", "General"];
      const normalizedType = type.trim();

      if (!validTypes.includes(normalizedType)) {
        window.alert("El tipo debe ser Guías, Builds, Bugs o General.");
        return;
      }

      const { data, error } = await supabase
        .from("posts")
        .update({
          titulo: title.trim(),
          contenido: content.trim(),
          tipo: normalizedType
        })
        .eq("id", post.id)
        .select("id");

      if (error) {
        console.error("Error editando publicación:", error);
        window.alert("No se pudo editar la publicación. Revisa tus permisos.");
        return;
      }

      if (!data || data.length === 0) {
        window.alert("No se modificó la publicación. Revisa tus permisos.");
        return;
      }

      await loadPosts();
    }

    async function deletePost(post) {
      const confirmed = window.confirm(
        "¿Eliminar esta publicación permanentemente? Esta acción no se puede deshacer."
      );
      if (!confirmed) return;

      const { data, error } = await supabase
        .from("posts")
        .delete()
        .eq("id", post.id)
        .select("id");

      if (error) {
        console.error("Error eliminando publicación:", error);
        window.alert(
          "No se pudo eliminar. Puede haber comentarios, likes o guardados relacionados, o faltar permisos."
        );
        return;
      }

      if (!data || data.length === 0) {
        window.alert("No se eliminó la publicación. Revisa tus permisos.");
        return;
      }

      await loadPosts();
    }

    function renderPosts() {
      postList.replaceChildren();

      const searchText = searchInput.value.trim().toLocaleLowerCase("es");

      const visiblePosts = allPosts.filter((post) => {
        const matchesType = !selectedType || post.tipo === selectedType;
        const searchableText = `${post.titulo || ""} ${post.contenido || ""}`.toLocaleLowerCase("es");
        const matchesSearch = !searchText || searchableText.includes(searchText);
        return matchesType && matchesSearch;
      });

      if (visiblePosts.length === 0) {
        setStatus("No hay publicaciones para este filtro.");
        return;
      }

      setStatus("");

      const typeLabels = {
        "Guías": "GUÍA",
        "Builds": "BUILDS",
        "Bugs": "BUGS",
        "General": "GENERAL"
      };

      visiblePosts.forEach((post) => {
        const card = makeElement("div", "space-y-2");
        const link = makeElement("a", "group block no-underline");
        link.href = `ficha.html?id=${encodeURIComponent(post.id)}`;

        const article = makeElement(
          "article",
          "rounded-xl border border-outline-variant bg-white p-4 transition-transform active:scale-[0.98]"
        );

        const authorRow = makeElement("div", "mb-3 flex items-center gap-3");
        const profile = post.authorProfile;
        const authorName = profile?.username?.trim() || "Jugador";

        const avatarFrame = makeElement(
          "div",
          "flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full border border-outline-variant bg-primary"
        );
        renderAvatar(avatarFrame, profile, authorName);

        const authorInfo = makeElement("div", "min-w-0 flex-1");
        authorInfo.appendChild(
          makeElement("p", "truncate font-label-bold text-label-bold text-on-surface", authorName)
        );
        authorInfo.appendChild(
          makeElement("p", "font-body-sm text-[11px] text-outline", timeAgo(post.created_at))
        );

        if (post.fijado) {
          const pinnedBadge = makeElement(
            "span",
            "inline-flex shrink-0 items-center gap-1 rounded-md bg-primary/10 px-2 py-1 text-[9px] font-label-bold text-primary"
          );
          pinnedBadge.appendChild(
            makeElement("span", "material-symbols-outlined text-[14px]", "push_pin")
          );
          pinnedBadge.appendChild(makeElement("span", "", "FIJADA"));
          authorRow.append(avatarFrame, authorInfo, pinnedBadge);
        } else {
          authorRow.append(avatarFrame, authorInfo);
        }

        const tag = makeElement(
          "span",
          "ml-auto shrink-0 rounded-md bg-secondary-container px-2 py-0.5 text-[9px] font-label-bold text-on-secondary-container",
          typeLabels[post.tipo] || "PUBLICACIÓN"
        );
        authorRow.appendChild(tag);

        const heading = makeElement(
          "h3",
          "mb-2 font-headline-md text-headline-md text-primary group-hover:underline",
          post.titulo || "Publicación sin título"
        );

        const content = makeElement(
          "p",
          "mb-4 line-clamp-2 font-body-md text-body-sm text-on-surface-variant",
          post.contenido || ""
        );

        const footer = makeElement(
          "div",
          "mt-1 flex items-center justify-between border-t border-outline-variant pt-3"
        );

        const counts = makeElement("div", "flex gap-4");

        const likes = makeElement("div", "flex items-center gap-1.5 text-on-surface-variant");
        likes.appendChild(makeElement("span", "material-symbols-outlined text-[18px]", "thumb_up"));
        likes.appendChild(
          makeElement("span", "font-label-bold text-label-bold", String(post.like_count ?? 0))
        );

        const comments = makeElement("div", "flex items-center gap-1.5 text-on-surface-variant");
        comments.appendChild(makeElement("span", "material-symbols-outlined text-[18px]", "chat_bubble"));
        comments.appendChild(
          makeElement("span", "font-label-bold text-label-bold", String(post.comment_count ?? 0))
        );

        counts.append(likes, comments);
        footer.appendChild(counts);

        article.append(authorRow, heading, content, footer);
        link.appendChild(article);
        card.appendChild(link);

        if (canManagePost(post) || currentUserIsAdmin) {
          const actions = makeElement("div", "flex justify-end gap-2");

          if (currentUserIsAdmin) {
            const pinButton = makeElement(
              "button",
              "inline-flex items-center gap-1 rounded-lg border border-outline-variant px-3 py-2 font-label-bold text-label-bold text-primary transition-colors hover:bg-primary/5",
              post.fijado ? "Desfijar" : "Fijar"
            );
            pinButton.type = "button";
            pinButton.setAttribute(
              "aria-label",
              post.fijado ? "Desfijar publicación" : "Fijar publicación"
            );
            pinButton.addEventListener("click", () => togglePinned(post));
            actions.appendChild(pinButton);
          }

          if (canManagePost(post)) {
            const editButton = makeElement(
              "button",
              "rounded-lg border border-outline-variant px-3 py-2 font-label-bold text-label-bold text-primary",
              "Editar"
            );
            editButton.type = "button";
            editButton.addEventListener("click", () => editPost(post));

            const deleteButton = makeElement(
              "button",
              "rounded-lg border border-red-200 px-3 py-2 font-label-bold text-label-bold text-error",
              "Eliminar"
            );
            deleteButton.type = "button";
            deleteButton.addEventListener("click", () => deletePost(post));

            actions.append(editButton, deleteButton);
          }

          card.appendChild(actions);
        }

        postList.appendChild(card);
      });
    }

    async function loadPosts() {
      if (!category) {
        setStatus("Falta la subcategoría en la dirección de esta página.");
        return;
      }

      if (!supabase) {
        supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      }

      const currentRequest = ++requestVersion;

      if (!authChecked) {
        const { data, error } = await supabase.auth.getUser();

        if (error) {
          console.error("Error comprobando la sesión:", error);
        } else {
          currentUserId = data.user?.id || null;
          currentUserIsAdmin = data.user?.app_metadata?.role === "admin";
        }

        authChecked = true;
      }

      if (currentRequest !== requestVersion) return;

      setStatus("Cargando publicaciones…");

      let query = supabase
        .from("posts")
        .select("id, created_at, titulo, contenido, tipo, like_count, comment_count, author_id, fijado")
        .eq("categoría", category)
        .order("fijado", { ascending: false })
        .order("created_at", { ascending: false });

      if (selectedType) {
        query = query.eq("tipo", selectedType);
      }

      const { data: posts, error: postsError } = await query;

      if (currentRequest !== requestVersion) return;

      if (postsError) {
        console.error("Error cargando publicaciones:", postsError);
        setStatus("No se pudieron cargar las publicaciones. Revisa la conexión y las políticas RLS de Supabase.");
        return;
      }

      const postRows = posts || [];
      const authorIds = [...new Set(postRows.map((post) => post.author_id).filter(Boolean))];
      const profilesById = new Map();

      if (authorIds.length > 0) {
        const { data: profiles, error: profilesError } = await supabase
          .from("usuarios_foro")
          .select("auth_user_id, username, avatar_url")
          .in("auth_user_id", authorIds);

        if (currentRequest !== requestVersion) return;

        if (profilesError) {
          console.error("Error cargando perfiles:", profilesError);
        } else {
          for (const profile of profiles || []) {
            profilesById.set(profile.auth_user_id, profile);
          }
        }
      }

      allPosts = postRows.map((post) => ({
        ...post,
        authorProfile: profilesById.get(post.author_id) || null
      }));

      renderPosts();
    }

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        filterButtons.forEach((item) => {
          item.classList.remove("bg-primary", "text-white");
          item.classList.add("border", "border-outline-variant", "bg-white", "text-on-surface-variant");
        });

        button.classList.add("bg-primary", "text-white");
        button.classList.remove("border", "border-outline-variant", "bg-white", "text-on-surface-variant");

        selectedType = button.dataset.type || "";
        loadPosts();
      });
    });

    searchInput.addEventListener("input", renderPosts);
    loadPosts();
  </script>

  <script>
    function toggleDrawer() {
      document.body.classList.toggle("drawer-open");
      document.body.classList.toggle("overflow-hidden");
    }

    window.addEventListener("scroll", () => {
      const header = document.querySelector("header");
      header.classList.toggle("shadow-md", window.scrollY > 20);
    });
  </script>
 </body>
