<body class="min-h-screen bg-background text-on-background pb-24">

        <span class="material-symbols-outlined">person</span>
        Mi perfil
      </a>
    </nav>

    <div class="border-t border-outline-variant p-4">
      <button
        type="button"

  <!-- Barra superior -->

  <main class="mx-auto max-w-md px-6 pt-20">
    <!-- Cabecera de la categoría -->

          class="h-full w-full object-cover"

        >

            <h2 class="text-lg font-bold text-white">Servidores Mu</h2>

      <!-- Búsqueda -->

        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>

          id="post-search"
          class="w-full rounded-xl border border-outline-variant bg-white py-3 pl-10 pr-4 text-sm focus:border-primary focus:ring-2 focus:ring-primary"

        >
      </div>

    <!-- Las publicaciones se cargan desde Supabase -->
    <section
      id="post-list"
      class="space-y-4"
      aria-live="polite"
      aria-label="Publicaciones de Servidores Mu"
    >
      <p id="feed-status" class="text-sm text-on-surface-variant">
        Cargando publicaciones…
      </p>
    </section>

  <!-- Navegación inferior -->
  <nav class="fixed bottom-0 left-0 right-0 z-[80] flex items-center justify-around border-t border-outline-variant bg-white px-4 py-2">

      <span class="material-symbols-outlined">home</span>
      <span class="text-[10px] font-bold">Inicio</span>

    <a href="mant.html" class="flex flex-col items-center gap-1 text-on-surface-variant">

      <span class="text-[10px] font-bold">Off</span>

    <a href="mant.html" class="flex flex-col items-center gap-1 text-on-surface-variant">

    </a>

    <a href="mant.html" class="flex flex-col items-center gap-1 text-on-surface-variant">
      <span class="material-symbols-outlined">person</span>
      <span class="text-[10px] font-bold">Off</span>
    </a>
  </nav>

  <script>
    function toggleDrawer() {
      document.body.classList.toggle('drawer-open');
      document.body.classList.toggle('overflow-hidden');
    }

    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      header.classList.toggle('shadow-md', window.scrollY > 20);
    });
  </script>

  <script type="module">
    import { supabase } from './conexion.js';

    // Debe coincidir con el valor de categoría guardado por el formulario.
    const CATEGORY = 'feed-mu';

    const postList = document.getElementById('post-list');
    const feedStatus = document.getElementById('feed-status');
    const searchInput = document.getElementById('post-search');

    let posts = [];
    let usernames = new Map();
    let avatarUrls = new Map();

    function getPlainText(html) {
      const doc = new DOMParser().parseFromString(html || '', 'text/html');
      return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function formatDate(dateValue) {
      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) return '';

      return date.toLocaleString('es', {
        dateStyle: 'medium',
        timeStyle: 'short'
      });
    }

    function createPostCard(post) {
      const link = document.createElement('a');
      link.className = 'block no-underline';
      link.href = `fpost.html?id=${encodeURIComponent(post.id)}`;

      const article = document.createElement('article');
      article.className =
        'rounded-xl border border-outline-variant bg-white p-4 transition-transform active:scale-[0.98]';

      const header = document.createElement('div');
      header.className = 'mb-3 flex items-center gap-3';

      const avatarContainer = document.createElement('div');
      avatarContainer.className =
        'flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border border-outline-variant bg-primary text-xs font-bold text-white';

      const username = usernames.get(post.author_id) || 'Jugador';
      const avatarUrl = avatarUrls.get(post.author_id);

      if (avatarUrl) {
        try {
          const parsedUrl = new URL(avatarUrl);

          if (parsedUrl.protocol === 'https:') {
            const avatar = document.createElement('img');
            avatar.src = parsedUrl.href;
            avatar.alt = '';
            avatar.className = 'h-full w-full object-cover';
            avatar.referrerPolicy = 'no-referrer';
            avatar.onerror = () => {
              avatarContainer.replaceChildren();
              avatarContainer.textContent = username.slice(0, 2).toUpperCase();
            };
            avatarContainer.append(avatar);
          } else {
            avatarContainer.textContent = username.slice(0, 2).toUpperCase();
          }
        } catch {
          avatarContainer.textContent = username.slice(0, 2).toUpperCase();
        }
      } else {
        avatarContainer.textContent = username.slice(0, 2).toUpperCase();
      }

      const authorInfo = document.createElement('div');
      authorInfo.className = 'min-w-0 flex-1';

      const authorName = document.createElement('p');
      authorName.className = 'truncate text-xs font-bold text-on-background';
      authorName.textContent = username;

      const date = document.createElement('p');
      date.className = 'text-[11px] text-outline';
      date.textContent = formatDate(post.created_at);

      authorInfo.append(authorName, date);

      const categoryBadge = document.createElement('span');
      categoryBadge.className =
        'rounded-md bg-secondary-container px-2 py-1 text-[9px] font-bold text-on-secondary-container';
      categoryBadge.textContent = 'SERVIDORES MU';

      header.append(avatarContainer, authorInfo, categoryBadge);

      const title = document.createElement('h2');
